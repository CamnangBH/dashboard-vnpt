<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Giao ban tuần – VNPT Hải Phòng</title>
<style>:root{
  --vnpt:#0066B3; --vnpt-d:#003E7E; --vnpt-dd:#062A55; --cyan:#00AEEF; --blue2:#4F8FD6; --plan:#B8CCE4;
  --ok:#15803D; --ok-bg:#E7F6EC; --warn:#B45309; --warn-bg:#FEF3C7; --warn-c:#F59E0B; --bad:#C81E1E; --bad-bg:#FDE8E8; --na:#64748B; --na-bg:#EEF2F6;
  --ink:#0F172A; --ink2:#334155; --muted:#64748B; --line:#E2E8F0; --bg:#F2F5F9; --card:#FFFFFF; --grid:#EDF1F6;
  --r:12px; --sh:0 1px 2px rgba(15,23,42,.06),0 2px 8px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select,input{font-family:inherit;font-size:13px}
.hdr{background:linear-gradient(110deg,var(--vnpt-dd) 0%,var(--vnpt-d) 45%,var(--vnpt) 100%);color:#fff;padding:14px 24px 12px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logo{width:48px;height:48px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.hdr .t1{font-size:13px;letter-spacing:.12em;font-weight:700;color:#9FDcFF;color:#BFE8FF}
.hdr .t2{font-size:20px;font-weight:800;letter-spacing:.01em;margin-top:1px}
.hdr .t3{font-size:13px;color:#D6E6F7;margin-top:2px}
.hdr .meta{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hdr .meta .fileinfo{font-size:12px;color:#D6E6F7;text-align:right;max-width:520px}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.primary{background:#fff;color:var(--vnpt-d);border-color:#fff}
.btn.primary:hover{background:#E6F3FF}
.btn.sm{padding:4px 9px;font-size:12px;font-weight:600}
.btn.light{background:#fff;color:var(--vnpt-d);border:1px solid #C9D8EA}
.btn.light:hover{background:#EEF5FD}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 16px;overflow-x:auto;position:sticky;top:0;z-index:30}
nav.tabs button{border:0;background:none;padding:13px 16px 11px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}
nav.tabs button.on{color:var(--vnpt);border-bottom-color:var(--vnpt)}
nav.tabs button:hover{color:var(--vnpt-d)}
nav.tabs .num{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--na-bg);color:var(--muted);font-size:11px;line-height:20px;text-align:center;margin-right:6px}
nav.tabs button.on .num{background:var(--vnpt);color:#fff}
.fbar{background:#F8FAFD;border-bottom:1px solid var(--line);padding:9px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:46px;z-index:29}
.fbar label{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.fbar select,.fbar input{border:1px solid #CBD5E1;border-radius:7px;padding:6px 8px;background:#fff;color:var(--ink);min-width:120px}
.fbar input{min-width:170px}
.fbar .scope{margin-left:auto;font-size:12px;color:var(--vnpt-d);background:#E6F0FA;border-radius:999px;padding:4px 10px;font-weight:600}
.fbar .btn.light{padding:6px 10px}
main{padding:18px 24px 40px;max-width:1680px;margin:0 auto}
.page{display:none}.page.on{display:block}
h2.ph{font-size:20px;margin:4px 0 2px;color:var(--vnpt-dd)}
.psub{color:var(--muted);font-size:13px;margin-bottom:14px}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h3{margin:0;font-size:16px;color:var(--vnpt-dd);font-weight:800;letter-spacing:.01em}
.sec .hint{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.card h4{margin:0 0 2px;font-size:14px;color:var(--ink);font-weight:700}
.card .cap{font-size:12px;color:var(--muted);margin-bottom:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px 12px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:4px;min-height:150px}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--vnpt)}
.kpi.ok:before{background:var(--ok)}.kpi.warn:before{background:var(--warn-c)}.kpi.bad:before{background:var(--bad)}.kpi.na:before{background:#CBD5E1}
.kpi .kt{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
.kpi .kv{font-size:28px;font-weight:800;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .kv small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.kpi .kl{font-size:12.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.kpi .kl b{font-variant-numeric:tabular-nums}
.card .kgrid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
.kpi .kfoot .chip{white-space:normal}
.kpi .kfoot{margin-top:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pbar{height:8px;background:#E8EEF5;border-radius:999px;position:relative;overflow:visible;margin:4px 0 2px}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--vnpt)}
.pbar i.ok{background:var(--ok)}.pbar i.warn{background:var(--warn-c)}.pbar i.bad{background:var(--bad)}
.pbar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;text-decoration:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.na{background:var(--na-bg);color:var(--na)}.chip.info{background:#E6F0FA;color:var(--vnpt-d)}
.chip:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.info:before{display:none}
.up{color:var(--ok);font-weight:700}.down{color:var(--bad);font-weight:700}.flat{color:var(--muted);font-weight:700}
.na{color:var(--muted);font-style:italic;font-size:12px}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:inherit}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:2px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.line{height:0;border-top:2px dashed var(--ink);width:16px;border-radius:0;opacity:.6}
.legend i.dia{width:9px;height:9px;transform:rotate(45deg);border-radius:1px}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t th{background:#F1F5FA;color:var(--ink2);font-weight:700;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap;position:sticky;top:0}
table.t th.s{cursor:pointer;user-select:none}
table.t th.s:hover{color:var(--vnpt)}
table.t th .arr{opacity:.45;font-size:10px;margin-left:3px}
table.t th.sorted .arr{opacity:1;color:var(--vnpt)}
table.t td{white-space:nowrap;padding:7px 8px;border-bottom:1px solid #EEF2F6;vertical-align:middle}
table.t tr:hover td{background:#F8FBFF}
table.t .r{text-align:right}table.t .c{text-align:center}
table.t td.nm{font-weight:600;white-space:nowrap}
table.t tr.tot td{background:#F4F8FD;font-weight:700}
.tag{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--na-bg);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.tw0{overflow-x:auto}
.tw{overflow:auto;max-height:720px;border:1px solid var(--line);border-radius:10px}
.thead{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.thead h4{margin:0}
.thead .sp{flex:1}
.rk{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-weight:800;font-size:12px;background:#E6F0FA;color:var(--vnpt-d)}
.rk.g{background:var(--ok-bg);color:var(--ok)}.rk.b{background:var(--bad-bg);color:var(--bad)}
.rankcard h4{display:flex;align-items:center;gap:8px}
.rankcard h4 .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.mini{font-size:12px;color:var(--muted)}
.minibar{display:inline-block;width:70px;height:6px;background:#E8EEF5;border-radius:99px;vertical-align:middle;margin-left:6px;position:relative;overflow:hidden}
.minibar i{position:absolute;left:0;top:0;bottom:0;background:var(--vnpt);border-radius:99px}
.minibar i.ok{background:var(--ok)}.minibar i.warn{background:var(--warn-c)}.minibar i.bad{background:var(--bad)}
.hl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hlbox{border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:#fff}
.hlbox h5{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.hlbox.pos h5{color:var(--ok)}.hlbox.neg h5{color:var(--bad)}.hlbox.neu h5{color:var(--vnpt-d)}.hlbox.wrn h5{color:var(--warn)}
.hlbox ol,.hlbox ul{margin:0;padding-left:18px}
.hlbox li{margin:0 0 7px;font-size:13px;color:var(--ink2)}
.hlbox li b{color:var(--ink)}
.ac{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.acg{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.acg .ah{padding:9px 14px;font-weight:800;font-size:13px;letter-spacing:.02em;color:#fff}
.acg.g1 .ah{background:var(--ok)}.acg.g2 .ah{background:var(--bad)}.acg.g3 .ah{background:var(--vnpt)}.acg.g4 .ah{background:#64748B}
.acg .ab{padding:10px 14px}
.acg ul{margin:0;padding-left:18px}.acg li{margin:0 0 6px;font-size:13px;color:var(--ink2)}
.banner{border-radius:10px;padding:9px 12px;font-size:12.5px;margin:10px 0;display:block}
.banner.warn{background:var(--warn-bg);color:#7C3E06;border:1px solid #FCD34D}
.banner.info{background:#E8F2FC;color:var(--vnpt-dd);border:1px solid #C5DCF3}
.cutoffs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.cutoffs .co{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px}
.cutoffs .co b{color:var(--vnpt-d)}
.cutoffs .co.diff{border-color:#F59E0B;background:#FFFBEB}
.subtabs{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.subtabs button{border:1px solid #C9D8EA;background:#fff;color:var(--vnpt-d);padding:7px 16px;border-radius:999px;font-weight:700;cursor:pointer}
.subtabs button.on{background:var(--vnpt);color:#fff;border-color:var(--vnpt)}
.mx td.cell{text-align:center;font-weight:700;font-size:12.5px;white-space:nowrap}
.mx td.cell.ok{background:#E3F4E8;color:#14532D}.mx td.cell.warn{background:#FEF0C7;color:#78350F}.mx td.cell.bad{background:#FBE3E3;color:#7F1D1D}.mx td.cell.na{background:#F4F6F9;color:var(--muted)}
.mx td.cell small{display:block;font-weight:600;font-size:10.5px;opacity:.8}
.mx th{text-align:center!important;white-space:normal!important;min-width:76px}
.mx th:first-child{text-align:left!important}
details.dm{margin-top:18px}
details.dm summary{cursor:pointer;font-weight:800;color:var(--vnpt-dd);font-size:15px;padding:8px 0}
.dmap td,.dmap th{font-size:12px}
.tip{position:fixed;pointer-events:none;background:#0F172A;color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;z-index:100;max-width:320px;box-shadow:0 6px 18px rgba(0,0,0,.2);display:none;line-height:1.45}
.tip b{color:#9FD8FF}
.toast{position:fixed;right:20px;bottom:20px;z-index:200;max-width:460px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--vnpt);border-radius:10px;padding:12px 14px;box-shadow:0 10px 30px rgba(15,23,42,.18);display:none;font-size:13px}
.toast.err{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}
.toast .x{float:right;cursor:pointer;color:var(--muted);margin-left:10px;font-weight:700}
.empty{padding:18px;text-align:center;color:var(--muted);font-style:italic}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:10px 0 30px}
.kv2{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv2 span:nth-child(odd){color:var(--muted)}
.kv2 span:nth-child(even){font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;z-index:300;font-weight:700;color:var(--vnpt-d)}
@media (max-width:1200px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.hl{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.g2,.g3,.g4,.hl,.ac{grid-template-columns:minmax(0,1fr)}main{padding:14px 12px 30px}.hdr{padding:12px}.fbar{padding:8px 12px;position:static}.hdr .meta{margin-left:0;align-items:flex-start}}
@media print{
  nav.tabs,.fbar,.btns,.noprint,.thead .btn,.subtabs{display:none!important}
  body{background:#fff;font-size:11px}
  .hdr{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  main{padding:8px;max-width:none}
  .card,.kpi,.hlbox,.acg{box-shadow:none;break-inside:avoid}
  .tw{max-height:none;overflow:visible}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* Đăng nhập & phân quyền */

.lglogo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#0066B3,#00AEEF);display:flex;align-items:center;justify-content:center;margin:0 auto 4px}
.lgt1{text-align:center;font-weight:800;letter-spacing:.14em;color:#0066B3;font-size:13px}
.lgt2{text-align:center;font-weight:700;color:#062A55;font-size:17px;margin-bottom:6px}
.lgcard label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:#334155}

.lgcard input:focus{border-color:#0066B3;box-shadow:0 0 0 3px rgba(0,102,179,.15)}
.lgerr{min-height:18px;color:#C81E1E;font-size:12.5px;font-weight:600}
.lgbtn{border:0;border-radius:9px;background:#0066B3;color:#fff;font-weight:800;padding:11px;cursor:pointer;letter-spacing:.05em;font-size:14px}
.lgbtn:hover{background:#003E7E}
.userbox{font-size:12px;color:#D6E6F7;display:flex;gap:8px;align-items:center;justify-content:flex-end}
.userbox .uname{font-weight:700;color:#fff}
.userbox .urole{background:rgba(255,255,255,.15);border-radius:999px;padding:2px 8px}
.grid.g3{align-items:start}
</style>
<script id="vnpt-sso">
/* ===== VNPT HPG – SSO dùng chung với Cổng điều hành =====
   Chỉ tài khoản trong SSO_USERS được vào bằng phiên của Cổng; các tài khoản khác đăng nhập riêng tại ứng dụng.
   Phiên do Cổng tạo: sessionStorage['vnpt_hpg_sso'] = {v:1,u,role,h,k,iat,last} (không chứa mật khẩu).
   PORTAL_URL: đường dẫn tới trang chính; mặc định Cổng nằm ở thư mục cha. */
window.VNPT_SSO = window.VNPT_SSO || (function(){
  var KEY='vnpt_hpg_sso', IDLE_MIN=30, MAX_HOURS=8;   // phải giống CONFIG của Cổng
  var PORTAL_URL='../index.html';
  var APP_ID='dtt';
  var SSO_USERS={'vnpt.hpg':'06d45f47017a0deb599accdea49f5e56708b5e9809d9f93b47b9bdabefab099a'};   // tài khoản SSO -> SHA-256("tài_khoản:mật_khẩu")
  function has(u){ return Object.prototype.hasOwnProperty.call(SSO_USERS,u); }
  function raw(){ try{ return JSON.parse(sessionStorage.getItem(KEY)||'null'); }catch(e){ return null; } }
  function read(){
    var s=raw(), hx=/^[0-9a-f]{64}$/;
    if(!s||s.v!==1||typeof s.u!=='string'||!has(s.u)||SSO_USERS[s.u]!==s.h||!hx.test(s.k||'')) return null;
    var t=Date.now(); if(t-s.iat>MAX_HOURS*3600e3||t-s.last>IDLE_MIN*60e3) return {expired:true};
    return s;
  }
  function touch(){ var s=raw(); if(s&&s.v===1){ s.last=Date.now(); try{ sessionStorage.setItem(KEY,JSON.stringify(s)); }catch(e){} } }
  function toPortal(reason){
    location.replace(PORTAL_URL+(PORTAL_URL.indexOf('?')<0?'?':'&')+'app='+encodeURIComponent(APP_ID)+(reason?'&reason='+encodeURIComponent(reason):''));
  }
  /* Trả về: phiên SSO hợp lệ | null (không có SSO → dùng đăng nhập riêng của ứng dụng) | false (SSO hết hạn, đang chuyển về Cổng) */
  function start(){
    var s=read(); if(!s) return null;
    if(s.expired){ try{ sessionStorage.removeItem(KEY); }catch(e){} toPortal('expired'); return false; }
    touch(); return s;
  }
  function check(){ var s=read(); if(!s||s.expired){ toPortal(s?'expired':'login'); return false; } return true; }
  /* Chỉ dùng ở chế độ SSO: gia hạn phiên khi thao tác, tự về Cổng khi hết hạn */
  function watch(){
    var last=0;
    function act(){ var t=Date.now(); if(t-last>15000){ last=t; if(check()) touch(); } }
    ['pointerdown','keydown','scroll'].forEach(function(ev){ addEventListener(ev,act,{passive:true}); });
    setInterval(check,30000);
    document.addEventListener('visibilitychange',function(){ if(!document.hidden) check(); });
  }
  function hexBytes(h){ var o=new Uint8Array(h.length/2); for(var i=0;i<o.length;i++) o[i]=parseInt(h.substr(i*2,2),16); return o; }
  return {start:start,isSsoUser:has,touch:touch,toPortal:toPortal,watch:watch,hexBytes:hexBytes,PORTAL_URL:PORTAL_URL};
})();
</script>

<body>
<div class="login" id="login">
  <form class="lgcard" id="loginForm" autocomplete="off">
    <div class="lglogo"><svg width="34" height="34" viewBox="0 0 30 30"><rect x="3" y="16" width="5" height="11" rx="1.5" fill="#fff"/><rect x="12.5" y="10" width="5" height="17" rx="1.5" fill="#fff"/><rect x="22" y="4" width="5" height="23" rx="1.5" fill="#7FD6FF"/></svg></div>
    <div class="lgt1">VNPT HẢI PHÒNG</div>
    <div class="lgt2">Dashboard giao ban điều hành kinh doanh tuần</div>
    <label>Tên đăng nhập<input id="lgUser" type="text" autocomplete="username" spellcheck="false" required></label>
    <label>Mật khẩu<input id="lgPass" type="password" autocomplete="current-password" required></label>
    <div class="lgerr" id="lgErr"></div>
    <button type="submit" class="lgbtn">ĐĂNG NHẬP</button>
  </form>
</div>
<div class="appwrap">
<header class="hdr">
  <div class="logo" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 30 30"><rect x="3" y="16" width="5" height="11" rx="1.5" fill="#0066B3"/><rect x="12.5" y="10" width="5" height="17" rx="1.5" fill="#0066B3"/><rect x="22" y="4" width="5" height="23" rx="1.5" fill="#00AEEF"/></svg></div>
  <div>
    <div class="t1">VNPT HẢI PHÒNG</div>
    <div class="t2">BÁO CÁO GIAO BAN ĐIỀU HÀNH KINH DOANH TUẦN</div>
  </div>
  <div class="meta">
    <div class="btns">
      <button class="btn primary admin-only" id="btnUpload" title="Chọn workbook giao ban mới (.xlsx)">⬆ TẢI LÊN FILE EXCEL</button>
      <button class="btn primary admin-only" id="btnExport" title="Tải về file dashboard .html mới chứa dữ liệu đang hiển thị">⬇ TẠO FILE HTML MỚI</button>
      <button class="btn" id="btnRefresh">⟳ Làm mới</button>
      <button class="btn" id="btnLogout">⎋ Đăng xuất</button>
    </div>
    <div class="userbox" id="userBox"></div>
    <input type="file" class="admin-only" id="fileIn" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="fbar">
  <label>Nhóm dịch vụ <select id="fSvc"></select></label>
  <label>Vùng <select id="fRegion"></select></label>
  <label>Đơn vị <select id="fUnit"></select></label>
  <label>Tìm nhanh <input id="fSearch" type="search" placeholder="Nhập tên đơn vị…"></label>
  <label>Trạng thái <select id="fStatus"></select></label>
  <button class="btn light" id="btnClear">✕ Xóa bộ lọc</button>
  <span class="scope" id="scope"></span>
</div>
<main>
  <section class="page on" id="p-mobile"></section>
  <section class="page" id="p-br"></section>
  <section class="page" id="p-dvs"></section>
  <section class="page" id="p-gh"></section>
  <section class="page" id="p-tc"></section>
</main>
</div>
<div class="toast" id="toast"></div>
<div class="loading" id="loading">Đang đọc file Excel…</div>

/* ===================== CHUẨN HÓA & PHÂN TÍCH CẤU TRÚC WORKBOOK ===================== */
const U = {
  norm: (s) => (s === null || s === undefined) ? '' : String(s).normalize('NFC').toLowerCase().replace(/\s+/g, ' ').trim(),
  isNum: (v) => typeof v === 'number' && isFinite(v),
  // Số: trả về {v, kind} ; kind: 'num' | 'blank' | 'dash' | 'text'
  num(v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    let s = String(v).trim();
    if (s === '' || /^[-–—]$/.test(s)) return null;
    let sign = 1;
    if (/^[▲↑+]/.test(s)) { s = s.replace(/^[▲↑+]\s*/, ''); }
    if (/^[▼↓]/.test(s)) { s = s.replace(/^[▼↓]\s*/, ''); sign = -1; }

    else if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); // 3.534.002 (vi)
    else if (/^-?\d+,\d+$/.test(s)) s = s.replace(',', '.');

  },
  pct(v) { // tỷ lệ -> dạng phân số (0.35 = 35%)
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    return U.num(v);
  },
  rawKind(v) { if (v === null || v === undefined || v === '') return 'blank'; if (typeof v === 'string' && /^[-–—]$/.test(v.trim())) return 'dash'; return U.num(v) === null ? 'text' : 'num'; },
  unitKey(name) {
    let s = String(name || '').normalize('NFC').replace(/\s+/g, ' ').trim();
    s = s.replace(/^(vnpt|địa bàn|đb|ttvt)\s*[-–]?\s*/i, '');
    return s.trim();
  },
  classify(name) {
    const n = U.norm(name);
    if (!n) return 'empty';
    if (/^(tổng|cộng|toàn)/.test(n)) return 'total';
    if (/^(đông|tây)(\s*hp)?$/.test(n) || /^(đb|địa bàn)\s*-?\s*(đông|tây)/.test(n)) return 'region';
    if (/trung tâm|^phòng|cskh|kdgp|^khác$/.test(n)) return 'center';
    if (/^(vnpt|địa bàn|đb|ttvt)\s/.test(n)) return 'unit';
    return 'center';
  },
  regionOf(name) { const n = U.norm(name); if (/đông/.test(n)) return 'Đông'; if (/tây/.test(n)) return 'Tây'; return null; },
  // gộp ô: copy giá trị ô góc trên-trái cho toàn vùng (chỉ dùng cho dòng tiêu đề)
  filled(aoa, merges) {
    const g = aoa.map(r => r.slice());
    for (const [r0, c0, r1, c1] of merges) {
      const v = (aoa[r0] || [])[c0];
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) { if (!g[r]) g[r] = []; if (r === r0 && c === c0) continue; g[r][c] = v === undefined ? null : v; }
    }

  },
  findRow(aoa, re, from = 0, to = 40) { for (let i = from; i < Math.min(aoa.length, to); i++) { if ((aoa[i] || []).some(v => re.test(U.norm(v)))) return i; } return -1; },
  paths(grid, r0, r1, width) {

const Model = (() => {
  let warnings, unknown, fixes;
  const W = (group, msg) => warnings.push({ group, msg });

  function pickSheet(sheets, re) { return sheets.find(s => re.test(U.norm(s.name))); }

  /* ---------- DI ĐỘNG ---------- */
  function parseMobile(sh, year) {
    const aoa = sh.aoa; const g = U.filled(aoa, sh.merges);
    const leafRow = U.findRow(aoa, /tổng tb quy đổi\s*\(qđ\)|trả trước qđ/);

    const width = Math.max(...aoa.map(r => r.length));
    const P = U.paths(g, Math.max(0, leafRow - 1), leafRow, width);
    const used = new Set();
    const f = (fn) => { const p = P.find(fn); if (p) used.add(p.c); return p ? p.c : -1; };
    const col = {
      name: 0,
      plan: f(p => /giao/.test(p.text) && /tổng tb quy đổi/.test(p.leaf)),
      planDT: f(p => /giao/.test(p.text) && /^doanh thu/.test(p.leaf)),
      actual: f(p => /tổng tb quy đổi\s*\(qđ\)/.test(p.leaf) || (/thực hiện/.test(p.text) && /^tổng tb quy đổi$/.test(p.leaf))), // T10 tuần 3: nhóm "Thực hiện"
      post: f(p => /trả sau qđ/.test(p.leaf)),
      pre: f(p => /trả trước qđ/.test(p.leaf)),
      dt: f(p => /tổng doanh thu/.test(p.leaf)),
      dtPost: f(p => /dt trả sau/.test(p.leaf)),
      dtPre: f(p => /dt trả trước/.test(p.leaf)),
      htTB: f(p => /hoàn thành|htkh/.test(p.text) && /tb quy đổi/.test(p.leaf)),
      rankTB: f(p => /hoàn thành|htkh/.test(p.text) && /xếp hạng tb/.test(p.leaf)),
      htDT: f(p => /hoàn thành|htkh/.test(p.text) && /^doanh thu/.test(p.leaf)),
      rankDT: f(p => /xếp hạng dt/.test(p.leaf)),
      prev: f(p => /cùng kỳ|so với t/.test(p.text) && /cùng kỳ/.test(p.leaf)),

    for (let r = leafRow + 1; r < aoa.length; r++) {

        ex: { post: v(col.post), pre: v(col.pre), dt: v(col.dt), dtPlan: v(col.planDT), dtPost: v(col.dtPost), dtPre: v(col.dtPre), excelHT: U.pct(row[col.htTB]), excelRank: v(col.rankTB), excelDiff: v(col.diff) } };

      if (o.ex.pre !== null && o.ex.pre < 0) W('Di động', `${o.name}: "Trả trước QĐ" âm (${o.ex.pre}) trong Excel – giữ nguyên số gốc.`);

    const out = {};

    for (const [key, label, re] of svcDefs) {

      const hasArea = P.some(p => inS(p) && /trên địa bàn/.test(p.text));

        plan: take(p => inS(p) && /kh tháng/.test(p.text)),
        actual: take(p => inA(p) && /lũy kế th/.test(p.leaf)),
        prev: take(p => inA(p) && /tháng trước/.test(p.leaf)),
        diffArea: take(p => inA(p) && /\(\s*\+\s*-\s*\)\s*ck/.test(p.leaf)),

        chActual: take(p => inS(p) && /theo kênh/.test(p.text) && /lũy kế th/.test(p.leaf)),
        chDiff: take(p => inS(p) && /theo kênh/.test(p.text) && /ck/.test(p.leaf)),
        chHT: take(p => inS(p) && /theo kênh/.test(p.text) && /^tlht$/.test(p.leaf)),
      };
      const rm = (key === 'fiber' || key === 'mytv') ? {
        max: take(p => /rời mạng/.test(p.text) && new RegExp(label.toLowerCase()).test(p.text) && /tối đa/.test(p.leaf)),
        val: take(p => /rời mạng/.test(p.text) && new RegExp(label.toLowerCase()).test(p.text) && /lũy kế rm/.test(p.leaf)),
        ratio: take(p => /rời mạng/.test(p.text) && new RegExp(label.toLowerCase()).test(p.text) && /tỷ lệ/.test(p.leaf)),

        const o = { name: String(name).trim(), key: U.unitKey(name), level: lv, region: lv === 'unit' ? (regionC >= 0 ? U.regionOf(row[regionC]) : null) : null,
          plan: v(col.plan), actual: v(col.actual), prev, prevDerived: derived,
          ex: { chActual: v(col.chActual), chDiff: v(col.chDiff), excelHT: U.pct(row[col.ht]), excelHTCK: U.pct(row[col.htCK]),
            rmMax: rm ? v(rm.max) : null, rm: rm ? v(rm.val) : null, rmRatioExcel: rm ? U.pct(row[rm.ratio]) : null } };

          const calc = (o.ex.rmMax && o.ex.rm !== null) ? o.ex.rm / o.ex.rmMax : null;
          o.ex.rmRatio = o.ex.rmRatioExcel !== null ? o.ex.rmRatioExcel : calc;
          if (calc !== null && o.ex.rmRatioExcel !== null) { tot++; const d = Math.abs(calc - o.ex.rmRatioExcel); if (d > 0.001) { n++; mx = Math.max(mx, d); } }

        prevLabel: derivedAny ? 'Cùng kỳ T9 (= LK − (+/−)CK)' : 'Tháng trước (cùng kỳ)',

  /* ---------- DỊCH VỤ SỐ ---------- */

  }

  /* ---------- GIA HẠN TRẢ TRƯỚC ---------- */
  function parseGH(sh, year) {

  }

  /* ---------- THU CƯỚC ---------- */
  function parseTC(sh, year) {
    const aoa = sh.aoa; const g = U.filled(aoa, sh.merges);
    const hr = U.findRow(aoa, /tổng doanh thu dư đầu kỳ|doanh thu phát sinh/);
    if (hr < 0) throw new Error(`Sheet "${sh.name}": không tìm thấy tiêu đề "Tổng doanh thu phát sinh".`);
    const width = Math.max(...aoa.map(r => r.length));
    const P = U.paths(g, Math.max(0, hr - 2), hr, width); const used = new Set([0]);
    const f = (fn) => { const p = P.find(p => !used.has(p.c) && fn(p)); if (p) used.add(p.c); return p ? p.c : -1; };
    const col = {
      dkDT: f(p => /doanh thu dư đầu kỳ/.test(p.leaf)), dkThu: f(p => /đã thu.*đầu kỳ/.test(p.leaf)), dkNo: f(p => /còn nợ đầu kỳ/.test(p.leaf)),

      tongTuyen: f(p => /tổng tuyến thu/.test(p.leaf)), nangGoi: f(p => /tổng tb nâng gói/.test(p.leaf)), daNop: f(p => /đã nộp cước/.test(p.leaf)), tlNG: f(p => /nâng gói/.test(p.text) && /tỷ lệ ht/.test(p.leaf)),
    };

    const periodLabel = psHead ? psHead.toUpperCase() : 'CƯỚC PHÁT SINH';

    for (let r = hr + 1; r < aoa.length; r++) {

      if (U.num(row[col.psDT]) === null && U.num(row[col.dkDT]) === null) continue; dataRows.push(r);
      const o = { name: String(name).trim(), key: U.unitKey(name), level: lv, region: null };
      for (const k of intCols) { const raw = col[k] >= 0 ? row[col[k]] : null; let v = U.num(raw); v = intFix(v, `${String(name).trim()} – ${P[col[k]] ? P[col[k]].leaf : k}`); o[k] = v; o[k + 'Kind'] = U.rawKind(raw); }
      o.tlLK = U.pct(row[col.tlLK]); o.tlPS = U.pct(row[col.tlPS]); o.tlPrev = U.pct(row[col.tlPrev]); o.soCK = U.pct(row[col.soCK]);
      o.note = col.note >= 0 && row[col.note] ? String(row[col.note]).trim() : null;
      o.tuyen = thresholds.map(t => { const raw = row[t.c]; return U.rawKind(raw) === 'dash' ? 0 : U.num(raw); });
      o.tongTuyen = U.num(row[col.tongTuyen]);
      o.tlNG = U.pct(row[col.tlNG]);
      o.psRate = (o.psDT && o.psThu !== null) ? o.psThu / o.psDT : null;

      const lkD = (o.dkDT || 0) + (o.psDT || 0), lkT = (o.dkThu || 0) + (o.psThu || 0);
      o.lkRate = (o.psDT !== null && lkD) ? lkT / lkD : null;
      // kiểm tra cân đối
      if (o.dkDT !== null && o.dkThu !== null && o.dkNo !== null && Math.abs(o.dkDT - o.dkThu - o.dkNo) > 1) W('Thu cước', `${o.name}: Dư đầu kỳ ≠ Đã thu + Còn nợ (lệch ${(o.dkDT - o.dkThu - o.dkNo).toLocaleString('vi-VN')} đ).`);
      if (o.psDT !== null && o.psThu !== null && o.psNo !== null && Math.abs(o.psDT - o.psThu - o.psNo) > 1) W('Thu cước', `${o.name}: Phát sinh ≠ Đã thu + Còn nợ (lệch ${(o.psDT - o.psThu - o.psNo).toLocaleString('vi-VN')} đ).`);

    return { key: 'tc', label: 'Thu cước phát sinh', sheet: sh.name, cutoff, title, periodLabel, dkLabel: dkHead ? dkHead.toUpperCase() : 'ĐẦU KỲ', rows, regions, total, thresholds, cutPoints: nums,

  }

  function build(wb, meta) {

    if (missing.length) throw new Error('Thiếu sheet: ' + missing.join(', ') + '. Các sheet có trong file: ' + S.map(s => s.name).join(', ') + '.');
    const M = { meta, year };

    // bản đồ vùng Đông/Tây từ dữ liệu (BR-CĐ cột vùng, Thu cước nhóm vùng)
    const regionMap = {};
    [M.fiber, M.tc].forEach(m => m.rows.forEach(r => { if (r.level === 'unit' && r.region) regionMap[r.key] = r.region; }));
    const all = [M.mobile, M.fiber, M.mytv, M.mesh, M.cam, M.dvs, M.gh, M.tc];
    all.forEach(m => m.rows.forEach(r => { if (r.level === 'unit') { r.region = regionMap[r.key] || r.region || null; } }));
    M.regionMap = regionMap;
    all.forEach(m => m.rows.forEach(r => { if (r.level === 'unit' && !r.region) W('Dữ liệu', `${m.label}: không xác định được vùng Đông/Tây của "${r.name}".`); }));

})();

    const head = T.cols.map(c => q(c.csvL || c.l.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim()));
    const lines = [head.join(';')].concat(rows.map(r => T.cols.map(c => { let v = (c.cv || c.sv || c.v)(r); if (typeof v === 'number' && isFinite(v)) v = String(Math.round(v * 1e6) / 1e6).replace('.', ','); return q(v); }).join(';')));

  }

/* ===================== ỨNG DỤNG DASHBOARD ===================== */
const App = (() => {
  const S = { M: null, wb: null, role: null, page: 'mobile', br: 'fiber', f: { region: 'all', unit: 'all', search: '', status: 'all' } };
  const PAGES = [['mobile', 'Di động'], ['br', 'Băng rộng cố định'], ['dvs', 'Dịch vụ số'], ['gh', 'Gia hạn trả trước'], ['tc', 'Thu cước phát sinh']];
  const COL = { plan: '#B8CCE4', act: '#0066B3', fc: '#00AEEF', t: '#0066B3', t1: '#00AEEF', paid: '#0066B3', debt: '#CBD5E1', pre: '#0066B3', post: '#00AEEF', ok: '#16A34A', warn: '#F59E0B', bad: '#DC2626', na: '#94A3B8' };
  const $ = (s, r = document) => r.querySelector(s);
  const svcList = () => S.M.plans.map(k => S.M[k]);

  /* ---------- Chuẩn bị số liệu sau khi đọc ---------- */
  function enrich(M) {
    for (const k of M.plans) { const s = M[k]; s.rows.forEach(r => Calc.metrics(r, s.cutoff)); if (s.total) Calc.metrics(s.total, s.cutoff); }
    return M;
  }
  /* ---------- Bộ lọc ---------- */
  const geoActive = () => S.f.region !== 'all' || S.f.unit !== 'all' || S.f.search.trim() !== '';
  const anyActive = () => geoActive() || S.f.status !== 'all';
  function geoPass(r) {
    if (r.level !== 'unit') return !geoActive();
    if (S.f.region !== 'all' && r.region !== S.f.region) return false;
    if (S.f.unit !== 'all' && r.key !== S.f.unit) return false;
    const q = U.norm(S.f.search); if (q && !U.norm(r.name + ' ' + r.key).includes(q)) return false;
    return true;
  }
  function statusPassPlan(r) { return S.f.status === 'all' || !/^(ok|warn|bad|na)$/.test(S.f.status) || (r.F && r.F.cls) === S.f.status; }
  const passPlan = (r) => geoPass(r) && statusPassPlan(r);
  function passGH(r) { if (!geoPass(r)) return false; const st = S.f.status; if (st === 'all' || !/^T1?:/.test(st)) return true; const [k, v] = [st.split(':')[0], st.slice(st.indexOf(':') + 1)]; return (r[k] && r[k].status) === v; }
  function passTC(r) { if (!geoPass(r)) return false; const st = S.f.status; if (st === 'all' || !/^N:/.test(st)) return true; return (r.note || '') === st.slice(2); }
  function scopeText() {
    if (!anyActive()) return 'Phạm vi: toàn địa bàn';
    const p = []; if (S.f.region !== 'all') p.push('Vùng ' + S.f.region); if (S.f.unit !== 'all') p.push(S.f.unit); if (S.f.search.trim()) p.push('“' + S.f.search.trim() + '”'); if (S.f.status !== 'all') p.push('Trạng thái: ' + statusLabel(S.f.status));
    return 'Phạm vi lọc: ' + p.join(' · ') + ' — tổng = cộng các dòng đơn vị thỏa bộ lọc';
  }
  function statusLabel(v) { if (CLS_LABEL[v]) return CLS_LABEL[v]; if (/^T1:/.test(v)) return 'T+1 ' + v.slice(3); if (/^T:/.test(v)) return 'T ' + v.slice(2); if (/^N:/.test(v)) return v.slice(2); return v; }
  // Tổng hợp cho dịch vụ có kế hoạch
  function agg(s) {
    if (!anyActive() && s.total) return { ...s.total, name: 'Toàn địa bàn', scope: 'excel', n: s.rows.length };
    const rs = s.rows.filter(passPlan);
    const sum = (f) => rs.length && rs.some(r => f(r) !== null && f(r) !== undefined) ? rs.reduce((a, r) => a + (f(r) || 0), 0) : null;
    const prevOk = rs.length && rs.every(r => r.prev !== null && r.prev !== undefined);
    const o = { name: 'Phạm vi lọc', scope: 'filter', n: rs.length, plan: sum(r => r.plan), actual: sum(r => r.actual), prev: prevOk ? sum(r => r.prev) : null,
      ex: { post: sum(r => r.ex.post), pre: sum(r => r.ex.pre), dt: sum(r => r.ex.dt), dtPlan: sum(r => r.ex.dtPlan), dtBH: sum(r => r.ex.dtBH), dtPB: sum(r => r.ex.dtPB), rm: sum(r => r.ex.rm), rmMax: sum(r => r.ex.rmMax), chActual: sum(r => r.ex.chActual) } };
    o.ex.rmRatio = Calc.ratio(o.ex.rm, o.ex.rmMax);

  }
  function pbar(v, cls, mark) { if (v === null || v === undefined || !isFinite(v)) return '<div class="pbar"></div>'; const w = Math.max(0, Math.min(1, v)) * 100; return `<div class="pbar" ${mark ? `data-tip="Vạch đen: tiến độ thời gian ${F.p(mark)}"` : ''}><i class="${cls || ''}" style="width:${w}%"></i>${mark ? `<u style="left:${Math.min(1, mark) * 100}%"></u>` : ''}</div>`; }

    $('#fUnit').innerHTML = `<option value="all">Tất cả đơn vị</option>` + keys.filter(k => S.f.region === 'all' || M.regionMap[k] === S.f.region).map(k => `<option value="${esc(k)}" ${S.f.unit === k ? 'selected' : ''}>${esc(k)} (${M.regionMap[k]})</option>`).join('');

  function renderStatusOptions() {

  /* ---------- Xếp hạng dùng chung ---------- */

    const parts = [

  }

    Chart.hbars($(`#c_${tag}_ht`), { series: [{ name: '%HTKH', color: COL.act }], fmt: v => F.p(v), axisFmt: v => F.p(v, 0), refLines: tp ? [{ v: tp, label: `Tiến độ TG ${F.p(tp, 0)}`, color: '#334155' }] : [], legendExtra: [{ name: 'Dự báo cuối tháng', color: COL.fc, type: 'dia' }],

    Object.entries(decl).filter(([, v]) => v.length >= 3).sort((a, b) => b[1].length - a[1].length).slice(0, 5).forEach(([k, v]) => g2.push(`<b>${esc(k)}</b> giảm so T9 ở ${v.length}/${A.length} dịch vụ: ${v.join(', ')}.`));
    const low = {}; A.forEach(({ s }) => unitsPlan(s).forEach(r => { if (r.F.cls === 'bad') low[r.key] = (low[r.key] || 0) + 1; }));
    const lowAll = Object.entries(low).filter(([, n]) => n === A.length).map(([k]) => k); if (lowAll.length) g2.push(`${lowAll.length} đơn vị dự báo dưới 90% KH ở cả ${A.length} dịch vụ: ${lowAll.map(esc).join(', ')}.`);
    A.slice().sort((a, b) => (b.A.F.accel ?? 0) - (a.A.F.accel ?? 0)).forEach(({ s, A }) => { if (A.F.gap === null || A.F.gap === undefined) return; g3.push(`<b>${esc(s.label)}</b>: còn thiếu <b>${F.n(A.F.gap, dec(s))}</b> ${s.unit} (${F.p(Calc.ratio(A.F.gap, A.plan))} KH) → cần <b>${F.n(A.F.need, 1)}/ngày</b> trong ${A.F.left} ngày, gấp ${F.nd(A.F.accel || 0, 1)} lần tốc độ hiện tại (${F.n(A.F.daily, 1)}/ngày).`); });
    const ghLow = M.gh.rows.filter(r => r.level === 'unit' && geoPass(r) && Calc.statusCls(r.T1.status) === 'bad').map(r => `${esc(r.key)} ${F.p(r.T1.rate, 1)}`);
    if (ghLow.length) g3.push(`<b>Gia hạn T+1</b> – đơn vị Excel đánh giá “Không đạt”: ${ghLow.join(', ')} (mức yc ${F.p(M.gh.total.T1.req, 0)}).`);
    const tcLow = M.tc.rows.filter(r => passTC(r) && Calc.statusCls(r.note) === 'bad').map(r => `${esc(r.key)} ${F.p(r.psRate, 2)}`); if (tcLow.length) g3.push(`<b>Thu cước PS</b> – Excel “Không chấp nhận”: ${tcLow.join(', ')}.`);
    const groups = {}; M.warnings.forEach(w => (groups[w.group] = groups[w.group] || []).push(w.msg));
    Object.entries(groups).forEach(([g, ms]) => ms.forEach(m => g4.push(`<b>${esc(g)}</b>: ${esc(m)}`)));
    if (M.unknown.length) { const by = {}; M.unknown.forEach(u => (by[u.sheet] = by[u.sheet] || []).push(u.col)); g4.push(`<b>Cột chưa xác định ý nghĩa (không dùng tính KPI)</b>: ${Object.entries(by).map(([s, c]) => `${esc(s)}: ${c.join(', ')}`).join('; ')}.`); }
    const grp = (c, t, items) => `<div class="acg ${c}"><div class="ah">${t}</div><div class="ab">${items.length ? `<ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>` : '<div class="mini">Không có mục nào trong phạm vi lọc.</div>'}</div></div>`;
    el.innerHTML = `<div class="ac">${grp('g1', 'NHÓM 1 — ĐƠN VỊ DẪN ĐẦU', g1)}${grp('g2', 'NHÓM 2 — ĐƠN VỊ CẦN HỖ TRỢ', g2)}${grp('g3', 'NHÓM 3 — CHỈ TIÊU CẦN TĂNG TỐC', g3)}${grp('g4', 'NHÓM 4 — CẢNH BÁO DỮ LIỆU', g4)}</div><div class="mini" style="margin-top:6px">Mọi nhận định nêu kèm số liệu căn cứ từ Excel; dashboard không suy diễn nguyên nhân kinh doanh.</div>`;
  }
  function dataMap(el) {
    const M = S.M;
    const map = [
      ['Di động T10', M.mobile.cutoff, 'Dòng “Tổng” (toàn địa bàn); 17 đơn vị “VNPT …” (xếp hạng); 2 Trung tâm (tính tổng, không xếp hạng)', 'KH = Giao/Tổng TB quy đổi · TH = Tổng TB quy đổi (QĐ) · Trả sau QĐ / Trả trước QĐ · DT: Giao/Doanh thu, Tổng DT cả HM · T9 = “cùng kỳ T9.2026” · Chênh lệch = TH − T9'],
      ['BR-CĐ T10', M.fiber.cutoff, 'Dòng “Tổng”; 17 “Địa bàn …” (vùng theo cột Tây HP/Đông HP); CSKH/Khác/KDGP chỉ có số theo kênh', 'Fiber/MyTV: KH tháng 10 · TH = KQ PTM trên địa bàn (Lũy kế TH) · T9 = cột “Tháng trước” · không dùng “TLHT so cùng kỳ” làm %HTKH · Mesh/Camera: KH, Lũy kế TH, (+ - ) CK → T9 = LK − CK · Rời mạng Fiber/MyTV: RM tối đa, Lũy kế RM, Tỷ lệ'],
      ['DVS T10', M.dvs.cutoff, 'Dòng “CỘNG”; 17 “VNPT …” (xếp hạng); TT Kinh doanh Giải pháp (tính tổng, không xếp hạng)', 'KH TBQĐ · TH TBQĐ · TH TBQĐ tháng trước · DT bán hàng / phân bổ (đồng) · Xếp hạng Excel chỉ để tham khảo'],
      ['GHTT T10', M.gh.cutoff, 'Dòng Tổng, Đông, Tây (không xếp hạng); 17 “ĐB …”', 'Mỗi khối T / T+1: SLTB hết hạn, SLTB gia hạn, Tỷ lệ gia hạn, Tỷ trọng gói, Mức yc, Tỷ lệ hoàn thành mục tiêu, Ngưỡng so mức yêu cầu (trạng thái)'],
      ['Thu cước T9', M.tc.cutoff, 'TOÀN ĐỊA BÀN; ĐB-ĐÔNG/TÂY HP (vùng); Phòng KHDN 1/2 (không xếp hạng); 17 “VNPT …”', 'Đầu kỳ (từ T01/2026): Dư, Đã thu, Còn nợ · PS kỳ cước T09: DT, Đã thu, Còn nợ · Tỷ lệ LK, Tỷ lệ PS, Tỷ lệ T08 cùng kỳ, Ghi chú (đánh giá), Tuyến thu theo ngưỡng, TB nâng gói'],
    ];
    el.innerHTML = `<div class="card" style="margin-bottom:12px"><div id="t_dmap"></div></div><div class="grid g2"><div class="card"><h4>Phương pháp tính</h4><ul style="margin:6px 0 0;padding-left:18px;font-size:13px;color:#334155">
      <li>Tỷ lệ hoàn thành = Thực hiện ÷ Kế hoạch × 100% (KH = 0 hoặc trống → “Chưa đủ dữ liệu”).</li><li>Chênh lệch = TH kỳ hiện tại − TH kỳ so sánh; Tăng trưởng = Chênh lệch ÷ kỳ so sánh (kỳ so sánh = 0 → chỉ hiện chênh lệch).</li>
      <li>Dự báo cuối tháng = Lũy kế ÷ d × số ngày của tháng; Dự báo HTKH = Dự báo ÷ KH; Còn thiếu = max(0, KH − Lũy kế); Cần/ngày = Còn thiếu ÷ (số ngày tháng − d). d = ngày chốt đọc từ Excel.</li>
      <li>Toàn địa bàn: dùng dòng Tổng của Excel (không cộng lại để tránh trùng). Khi lọc: cộng các dòng đơn vị thỏa bộ lọc.</li><li>Xếp hạng chỉ gồm 17 đơn vị địa bàn cùng cấp; Trung tâm/Phòng, dòng Tổng, Đông, Tây không xếp hạng.</li>
      <li>Ngưỡng dự báo (≥100% / 90–<100% / <90%) chỉ là cảnh báo dự báo, không thay ngưỡng thi đua nội bộ.</li></ul></div>
      <div class="card"><h4>Cột chưa xác định (không dùng tính KPI)</h4><div id="t_unk"></div></div></div>`;
    Tables.render($('#t_dmap'), 'dmap', [{ k: 's', l: 'Sheet', v: r => r[0], tdc: 'nm' }, { k: 'c', l: 'Ngày chốt', v: r => r[1] ? F.dm(r[1]) + ' – “' + r[1].text + '”' : 'không đọc được' }, { k: 'l', l: 'Cấp dòng dữ liệu', v: r => r[2], f: r => `<span style="white-space:normal">${esc(r[2])}</span>` }, { k: 'm', l: 'Trường dữ liệu được sử dụng', v: r => r[3], f: r => `<span style="white-space:normal">${esc(r[3])}</span>` }], map, { title: 'Bản đồ dữ liệu', name: 'Ban_do_du_lieu', noscroll: true });
    Tables.render($('#t_unk'), 'unk', [{ k: 's', l: 'Sheet', v: r => r.sheet }, { k: 'c', l: 'Cột', v: r => r.col, a: 'c' }, { k: 'h', l: 'Tiêu đề trong Excel', v: r => r.header }], M.unknown, { name: 'Cot_chua_xac_dinh' });
  }

  /* ---------- Khởi tạo, sự kiện, tải Excel ---------- */
  function load(wb, meta) { const M = enrich(Model.build(wb, meta)); S.M = M; if (S.f.unit !== 'all' && !M.regionMap[S.f.unit]) S.f.unit = 'all'; renderShell(); render(); return M; }
  function toast(msg, cls = '') { const t = $('#toast'); t.className = 'toast ' + cls; t.innerHTML = `<span class="x" onclick="this.parentNode.style.display='none'">✕</span>${msg}`; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', cls === 'err' ? 15000 : 6000); }
  async function onFile(file) {
    if (!file) return; if (S.role !== 'admin') { toast('✖ Tài khoản hiện tại không có quyền tải dữ liệu.', 'err'); return; } $('#loading').style.display = 'flex';
    const backup = { M: S.M };
    try {
      if (!/\.xlsx$/i.test(file.name)) throw new Error('Chỉ hỗ trợ file .xlsx (Excel 2007 trở lên). Với file .xls hãy mở bằng Excel và lưu lại dạng .xlsx.');
      const buf = await file.arrayBuffer(); const wb = await XLSXReader.read(buf);
      const now = new Date(); const p = (n) => String(n).padStart(2, '0');
      const M = Model.build(wb, { fileName: file.name, loadedAt: `${p(now.getHours())}:${p(now.getMinutes())} ${p(now.getDate())}/${p(now.getMonth() + 1)}/${now.getFullYear()}`, mode: 'upload' });
      enrich(M); S.M = M; S.wb = wb; if (S.f.unit !== 'all' && !M.regionMap[S.f.unit]) S.f.unit = 'all'; renderShell(); render();
      toast(`✔ Đã cập nhật dữ liệu từ <b>${esc(file.name)}</b>. Bấm “TẠO FILE HTML MỚI” để lưu dashboard với dữ liệu này.`, 'ok');
    } catch (e) { console.error(e); S.M = backup.M; renderShell(); render(); toast(`✖ Không đọc được file <b>${esc(file.name)}</b>: ${esc(e.message)}<br><span class="mini">Dữ liệu đang hiển thị được giữ nguyên.</span>`, 'err'); }
    finally { $('#loading').style.display = 'none'; $('#fileIn').value = ''; }
  }
  function bind() {
    document.addEventListener('click', (e) => {
      const b = e.target.closest('[data-page]'); if (b) { go(b.dataset.page); return; }
      const br = e.target.closest('[data-br]'); if (br) { S.br = br.dataset.br; render(); return; }
    });
    $('#fSvc').addEventListener('change', e => go(e.target.value));
    $('#fRegion').addEventListener('change', e => { S.f.region = e.target.value; if (S.f.unit !== 'all' && S.M.regionMap[S.f.unit] !== S.f.region && S.f.region !== 'all') S.f.unit = 'all'; renderShell(); render(); });
    $('#fUnit').addEventListener('change', e => { S.f.unit = e.target.value; render(); });
    let tmr; $('#fSearch').addEventListener('input', e => { clearTimeout(tmr); tmr = setTimeout(() => { S.f.search = e.target.value; render(); }, 250); });
    $('#fStatus').addEventListener('change', e => { S.f.status = e.target.value; render(); });
    $('#btnClear').addEventListener('click', () => { S.f = { region: 'all', unit: 'all', search: '', status: 'all' }; renderShell(); render(); });
    $('#btnExport').addEventListener('click', exportHtml);
    $('#btnLogout').addEventListener('click', logout);
    $('#loginForm').addEventListener('submit', (e) => { e.preventDefault(); login($('#lgUser').value, $('#lgPass').value); });
    $('#btnRefresh').addEventListener('click', () => { renderShell(); render(); toast('Đã làm mới giao diện.'); });
    $('#btnUpload').addEventListener('click', () => $('#fileIn').click());
    $('#fileIn').addEventListener('change', e => onFile(e.target.files[0]));
    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', e => { e.preventDefault(); if (S.role !== 'admin') return; const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) onFile(f); });
    let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 200); });
    window.addEventListener('beforeprint', () => { document.querySelectorAll('details').forEach(d => d.open = true); });
  }
  /* ---------- Đăng nhập & phân quyền ---------- */
  // Mật khẩu không lưu dạng rõ: chỉ lưu SHA-256(tên đăng nhập + ':' + mật khẩu)
  const USERS = {
    'vnpt.hpg': { h: '06d45f47017a0deb599accdea49f5e56708b5e9809d9f93b47b9bdabefab099a', role: 'viewer', label: 'Chỉ xem', sso: true }, // chỉ vào qua Cổng (SSO)
    'admin': { h: 'bdd8d1253d81b210be056b9fe2d27231dc425b3d890da6d5c326f408617b9270', role: 'admin', label: 'Quản trị – tải dữ liệu & tạo file' },
    'nstg.hpg': { h: '27da04a4b7d857d0561deb1bbdcd50c51f1b55ec801e02a24c525790c1cdc2a2', role: 'viewer', label: 'Chỉ xem' },
  };
  const SKEY = 'vnpt_hpg_dash_session';
  function setRole(user) {
    const u = USERS[user]; S.role = u ? u.role : null; S.user = u ? user : null;
    if (u) document.body.setAttribute('data-role', u.role); else document.body.removeAttribute('data-role');
    $('#userBox').innerHTML = u ? `<span class="uname">👤 ${esc(user)}</span><span class="urole">${esc(u.label)}</span>` : '';
    if (u && !S.M) { try { load(EMBED.wb, { fileName: EMBED.fileName, loadedAt: EMBED.loadedAt, mode: 'embedded' }); S.wb = EMBED.wb; } catch (e) { console.error(e); toast('✖ Lỗi đọc dữ liệu nhúng: ' + esc(e.message), 'err'); } }
    else if (u) { renderShell(); render(); }
  }
  function login(user, pass) {
    user = String(user || '').trim().toLowerCase(); const u = USERS[user];
    if (u && u.sso) { $('#lgErr').textContent = 'Tài khoản này đăng nhập qua Cổng điều hành.'; $('#lgPass').value = ''; return; }
    const ok = u && SHA256(user + ':' + pass) === u.h;
    if (!ok) { $('#lgErr').textContent = 'Tên đăng nhập hoặc mật khẩu không đúng.'; $('#lgPass').value = ''; $('#lgPass').focus(); return; }
    $('#lgErr').textContent = ''; $('#lgPass').value = '';
    try { sessionStorage.setItem(SKEY, JSON.stringify({ user, h: u.h })); } catch (e) {}
    setRole(user);
  }
  function logout() {
    if (S.viaSSO) { S.viaSSO = false; try { sessionStorage.removeItem(SKEY); } catch (e) {} VNPT_SSO.toPortal('logout'); return; }  // SSO → về Cổng
    try { sessionStorage.removeItem(SKEY); } catch (e) {} setRole(null); $('#lgUser').value = ''; $('#lgUser').focus(); }
  /* ---------- Tạo file HTML mới (chỉ admin) ---------- */
  function exportHtml() {
    if (S.role !== 'admin') { toast('✖ Tài khoản hiện tại không có quyền tạo file.', 'err'); return; }
    const tpl = window.__TPL; if (!tpl) { toast('✖ Không lấy được mẫu trang để tạo file.', 'err'); return; }
    const open = '<script id="embedData">'; const i = tpl.indexOf(open); const j = i < 0 ? -1 : tpl.indexOf('<' + '/script>', i);
    if (i < 0 || j < 0) { toast('✖ Không tìm thấy vùng dữ liệu nhúng trong mẫu trang.', 'err'); return; }
    const now = new Date(); const p = (n) => String(n).padStart(2, '0');
    const data = { fileName: S.M.meta.fileName, loadedAt: S.M.meta.loadedAt || `${p(now.getHours())}:${p(now.getMinutes())} ${p(now.getDate())}/${p(now.getMonth() + 1)}/${now.getFullYear()}`, wb: S.wb };
    const js = 'const EMBED = ' + JSON.stringify(data).replace(/<\//g, '<\\/') + ';';
    const html = tpl.slice(0, i + open.length) + js + tpl.slice(j);
    const c = S.M.mobile.cutoff || S.M.cutoffs.map(x => x.c).find(Boolean);
    const name = 'Dashboard_Giao_ban_tuan_VNPT_Hai_Phong' + (c ? `_${p(c.d)}${p(c.m)}${c.y}` : '') + '.html';
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast(`✔ Đã tạo file <b>${esc(name)}</b> chứa dữ liệu hiện tại. File mới dùng chung tài khoản đăng nhập.`, 'ok');
  }
  function init() {
    bind();
    const sso = VNPT_SSO.start(); if (sso === false) return;
    if (sso && USERS[sso.u]) { S.viaSSO = true; setRole(sso.u); VNPT_SSO.watch(); return; }
    let saved = null; try { saved = JSON.parse(sessionStorage.getItem(SKEY) || 'null'); } catch (e) {}
    if (saved && USERS[saved.user] && !USERS[saved.user].sso && USERS[saved.user].h === saved.h) setRole(saved.user); else { setRole(null); setTimeout(() => $('#lgUser').focus(), 50); }
  }
  return { init, S, load, go, login, logout };
})();
document.addEventListener('DOMContentLoaded', App.init);
</script>
<script>window.__TPL = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;</script>
</body>
