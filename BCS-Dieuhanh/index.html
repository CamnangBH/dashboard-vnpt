<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard điều hành SXKD VNPT Hải Phòng – T09/2026</title>
<style>
:root{
  --vnpt:#0057B8; --vnpt-d:#003C82; --cyan:#00A0C6; --bg:#F3F6FA; --card:#FFFFFF; --ink:#1B2430; --ink2:#4A5565; --muted:#7A8594;
  --line:#E2E8F0; --grid:#EDF1F6; --plan:#A8C5E8;
  --cn:#1E7F3C; --cn-bg:#E3F4E8; --qt:#B26B00; --qt-bg:#FFF3D6; --kcn:#C62828; --kcn-bg:#FDE4E4; --na:#8A94A3; --na-bg:#EEF1F5;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13.5px;color:var(--ink);background:var(--bg);line-height:1.45}
a{color:var(--vnpt)}
header.top{background:linear-gradient(100deg,var(--vnpt-d),var(--vnpt) 60%,var(--cyan));color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.logo{font-weight:800;letter-spacing:.5px;font-size:20px;background:#fff;color:var(--vnpt);border-radius:8px;padding:4px 10px}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{font-size:12px;opacity:.9}
header .actions{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--vnpt);color:var(--vnpt)}
.btn.primary{background:var(--vnpt);color:#fff;border-color:var(--vnpt)}
header .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.4)}
header .btn-exit{text-decoration:none;display:inline-flex;align-items:center;font-weight:600;background:#fff;color:var(--vnpt);border-color:#fff}
header .btn-exit:hover{background:#FFF4DE;color:var(--vnpt-d);border-color:#FFF4DE}
.layout{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 60px)}
nav.side{background:#fff;border-right:1px solid var(--line);padding:12px 8px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
nav.side .grp{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.6px;margin:12px 10px 4px}
nav.side a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:7px;color:var(--ink2);text-decoration:none;font-size:13px}
nav.side a .n{display:inline-block;min-width:20px;font-size:11px;color:var(--muted)}
nav.side a:hover{background:var(--bg)}
nav.side a.active{background:#E6F0FB;color:var(--vnpt);font-weight:600}
main{padding:14px 20px 40px;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;box-shadow:var(--shadow)}
.filters label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px}
select,input[type=text],input[type=number]{font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);min-width:120px}
input[type=number]{min-width:80px;width:100px}
.page-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 12px}
.page-title h2{margin:0;font-size:19px;color:var(--vnpt-d)}
.page-title .desc{color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--vnpt)}
.kpi.cn:before{background:var(--cn)}.kpi.qt:before{background:var(--qt)}.kpi.kcn:before{background:var(--kcn)}.kpi.na:before{background:var(--na)}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--ink2);margin-top:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 2px;font-size:14px;color:var(--ink)}
.card .cap{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.card + .card{margin-top:0}
.section{margin-top:14px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-CN{background:var(--cn-bg);color:var(--cn)}.b-QT{background:var(--qt-bg);color:var(--qt)}.b-KCN{background:var(--kcn-bg);color:var(--kcn)}.b-NA{background:var(--na-bg);color:var(--na)}
.b-info{background:#E6F0FB;color:var(--vnpt)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{position:sticky;top:0;background:#F7F9FC;text-align:left;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line);padding:7px 8px;cursor:pointer;white-space:nowrap;user-select:none}
table.t th.num,table.t td.num{text-align:right}
table.t td{border-bottom:1px solid var(--grid);padding:6px 8px;vertical-align:top}
table.t tr:hover td{background:#F7FAFF}
table.t td.clk{color:var(--vnpt);cursor:pointer;font-weight:600;white-space:nowrap}
.nw{white-space:nowrap}
.tbl-wrap:has(.hm){max-height:none}
.hm td:first-child,.hm td a{white-space:nowrap}
.tbl-wrap{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:8px}
.tbl-tools{display:flex;justify-content:space-between;align-items:center;margin:6px 0;gap:8px;flex-wrap:wrap}
.tbl-tools .cnt{font-size:11.5px;color:var(--muted)}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:10px;border-radius:2px;display:inline-block}
#tip{position:fixed;z-index:100;pointer-events:none;background:#0F1A2A;color:#fff;font-size:12px;padding:7px 9px;border-radius:7px;max-width:340px;box-shadow:0 4px 16px rgba(0,0,0,.25);display:none;line-height:1.4}
#tip b{color:#9FD3FF}
.note{background:#F2F7FD;border:1px solid #D4E4F7;border-left:4px solid var(--vnpt);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--ink2);margin:10px 0}
.note.warn{background:#FFF8E6;border-color:#F5DFA6;border-left-color:var(--qt)}
.note.err{background:#FDEEEE;border-color:#F3C5C5;border-left-color:var(--kcn)}
.issues{counter-reset:iss;display:grid;gap:10px}
.issue{display:grid;grid-template-columns:34px 1fr;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.issue .num{width:30px;height:30px;border-radius:50%;background:var(--kcn);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.issue h4{margin:0 0 3px;font-size:13.5px}
.issue .ev{font-size:12.5px;color:var(--ink2)}
.issue .act{font-size:12.5px;margin-top:4px}
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;margin-right:4px}
.hm td.c{text-align:center;font-weight:600;font-size:12px;min-width:56px;cursor:default}
.hm td.CN{background:var(--cn-bg);color:var(--cn)}.hm td.QT{background:var(--qt-bg);color:var(--qt)}.hm td.KCN{background:var(--kcn-bg);color:var(--kcn)}.hm td.NA{background:var(--na-bg);color:var(--na)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:7px 12px;font-family:inherit;font-size:13px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--vnpt);border-bottom-color:var(--vnpt);font-weight:600}
.pill-row{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:#fff;cursor:pointer}
.chk input{margin:0}
.muted{color:var(--muted)}
.small{font-size:11.5px}
.flag{color:var(--kcn);font-weight:700;cursor:help}
.err-card{background:#FDEEEE;border:1px solid #F3C5C5;color:#8A1C1C;border-radius:10px;padding:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.facts li{margin:3px 0}
.lbl-fact{color:var(--cn)}.lbl-ana{color:var(--vnpt)}.lbl-hyp{color:var(--qt)}.lbl-na{color:var(--na)}
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 16px}
.cfg label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}
.back{margin-bottom:8px}
.footer{color:var(--muted);font-size:11.5px;margin-top:24px;border-top:1px solid var(--line);padding-top:10px}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.layout{grid-template-columns:1fr}nav.side{position:static;height:auto;display:flex;flex-wrap:wrap;gap:2px}nav.side .grp{width:100%}.g2,.g3,.g4,.two{grid-template-columns:1fr}header.top{position:static}main{padding:12px}}
@media print{
  header.top{position:static;background:var(--vnpt)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  nav.side,.filters,.btn,.tbl-tools button{display:none!important}
  .layout{display:block}
  .tbl-wrap{max-height:none;overflow:visible}
  .card,.kpi{box-shadow:none;break-inside:avoid}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* ====== NÂNG CẤP GIAO DIỆN ====== */
body{background:radial-gradient(1200px 500px at 85% -10%,#DCEBFF 0,transparent 60%),radial-gradient(900px 400px at -10% 30%,#E3F6FB 0,transparent 55%),#F2F6FB;background-attachment:fixed}
header.top{background:linear-gradient(105deg,#002B66 0%,#0057B8 48%,#00A0C6 100%);box-shadow:0 6px 24px rgba(0,58,128,.28);overflow:hidden}
header.top:after{content:"";position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(circle at 78% 120%,rgba(255,255,255,.18) 0 120px,transparent 121px),
  radial-gradient(circle at 92% -40%,rgba(255,255,255,.12) 0 160px,transparent 161px),
  repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px)}
header.top>*{position:relative;z-index:1}
.logo{box-shadow:0 4px 14px rgba(0,0,0,.18);border-radius:10px;letter-spacing:1px}
header h1{letter-spacing:.4px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.layout{transition:grid-template-columns .3s cubic-bezier(.2,.8,.2,1)}
nav.side{background:linear-gradient(180deg,#FFFFFF 0%,#F6FAFF 100%);border-right:1px solid #E1E9F4;padding:10px 10px;display:flex;flex-direction:column;gap:2px;box-shadow:2px 0 12px rgba(0,58,128,.04)}
nav.side .nav-toggle{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#4A5565;padding:9px 12px;border-radius:10px;cursor:pointer;font:inherit;font-size:12.5px;margin-bottom:4px;transition:background .2s,color .2s}
nav.side .nav-toggle:hover{background:#EAF2FD;color:var(--vnpt)}
nav.side .grp{margin:14px 12px 6px;font-weight:700;color:#8A96A8;letter-spacing:.8px;white-space:nowrap}
nav.side a{position:relative;gap:12px;padding:10px 12px;border-radius:12px;color:#3B4656;font-weight:500;white-space:nowrap;overflow:hidden;transition:background .25s,color .25s,transform .25s,box-shadow .25s}
nav.side a .ic{display:inline-flex;width:34px;height:34px;flex:0 0 34px;align-items:center;justify-content:center;border-radius:10px;background:#EEF4FC;color:#3B6FB6;transition:all .25s}
nav.side a .lbl{white-space:normal;line-height:1.3}
nav.side a:hover{background:#EEF5FE;transform:translateX(3px)}
nav.side a:hover .ic{background:#DCEAFD;color:var(--vnpt)}
nav.side a.active{background:linear-gradient(100deg,#0057B8,#0A86D6);color:#fff;font-weight:600;box-shadow:0 8px 18px rgba(0,87,184,.28)}
nav.side a.active .ic{background:rgba(255,255,255,.2);color:#fff}
nav.side a.active:before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:4px;border-radius:0 4px 4px 0;background:#7FE3FF}
nav.side .nav-foot{margin-top:auto;padding:12px;border-radius:12px;background:linear-gradient(135deg,#EAF3FF,#E5F8FC);font-size:11.5px;color:#4A5565}
body.nav-mini .layout{grid-template-columns:76px 1fr}
body.nav-mini nav.side .lbl{display:none}
body.nav-mini nav.side .grp{height:1px;background:#E1E9F4;margin:10px 8px}
body.nav-mini nav.side a{justify-content:center;padding:8px}
body.nav-mini nav.side a:hover{transform:none}
body.nav-mini nav.side .nav-toggle{justify-content:center}
body.nav-mini nav.side .nav-foot{display:none}
.filters{border-radius:14px;border-color:#E1E9F4;box-shadow:0 2px 10px rgba(0,58,128,.05)}
select,input[type=text],input[type=number]{border-radius:9px;transition:border-color .2s,box-shadow .2s}
select:focus,input:focus{outline:none;border-color:#5C9BE6;box-shadow:0 0 0 3px rgba(0,87,184,.12)}
.btn{border-radius:9px;transition:all .2s}
.page-title h2{background:linear-gradient(90deg,#003C82,#0090C6);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:21px}
.page-in{animation:pageIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kpi{border-radius:14px;border-color:#E3EAF4;padding:12px 14px;box-shadow:0 2px 10px rgba(0,58,128,.06);transition:transform .25s,box-shadow .25s;animation:pageIn .5s cubic-bezier(.2,.8,.2,1) both;background:linear-gradient(160deg,#FFFFFF 55%,#F5F9FF 100%)}
.kpi:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,58,128,.12)}
.kpi:before{width:100%;height:4px;bottom:auto;background:linear-gradient(90deg,#0057B8,#00A0C6)}
.kpi.cn:before{background:linear-gradient(90deg,#1E7F3C,#5BC27A)}.kpi.qt:before{background:linear-gradient(90deg,#B26B00,#F2B33D)}.kpi.kcn:before{background:linear-gradient(90deg,#C62828,#F06A5A)}.kpi.na:before{background:linear-gradient(90deg,#8A94A3,#C3CAD4)}
.kpi.blk-C2:before{background:linear-gradient(90deg,#0057B8,#4D95E6)}.kpi.blk-VNPTKV:before{background:linear-gradient(90deg,#D9730D,#F2A65A)}.kpi.blk-TTVT:before{background:linear-gradient(90deg,#0090B0,#4CC7DF)}
.kpi .v{font-size:23px;letter-spacing:-.3px;color:#0F1E33}
.kpi.has-ring{padding-right:64px}
.kpi .ring{position:absolute;right:10px;top:14px}
.ring-arc{animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1) .15s forwards}
@keyframes ringIn{to{stroke-dashoffset:var(--off)}}
.card{border-radius:14px;border-color:#E3EAF4;box-shadow:0 2px 12px rgba(0,58,128,.06);transition:box-shadow .3s,transform .3s;animation:pageIn .55s cubic-bezier(.2,.8,.2,1) both}
.card:hover{box-shadow:0 10px 28px rgba(0,58,128,.11)}
.card h3{display:flex;align-items:center;gap:8px;font-size:14.5px;color:#0F1E33}
.card h3:before{content:"";width:6px;height:16px;border-radius:3px;background:linear-gradient(180deg,#00A0C6,#0057B8);flex:0 0 6px}
.tabs{border-bottom:0;background:#F1F5FB;border-radius:11px;padding:4px;display:inline-flex;gap:2px}
.tabs button{border:0;border-radius:8px;padding:6px 12px;transition:all .25s}
.tabs button:hover{color:var(--vnpt)}
.tabs button.on{background:#fff;color:var(--vnpt);box-shadow:0 2px 8px rgba(0,58,128,.12);border-bottom-color:transparent}
.issue{border-radius:12px;border-color:#E8EEF6;transition:transform .25s,box-shadow .25s;background:linear-gradient(90deg,#FFF 0%,#FBFDFF 100%);animation:pageIn .5s cubic-bezier(.2,.8,.2,1) both}
.issue:nth-child(2){animation-delay:.05s}.issue:nth-child(3){animation-delay:.1s}.issue:nth-child(4){animation-delay:.15s}.issue:nth-child(5){animation-delay:.2s}
.issue:hover{transform:translateX(4px);box-shadow:0 6px 18px rgba(0,58,128,.09)}
.issue .num{background:linear-gradient(135deg,#F06A5A,#C62828)!important;box-shadow:0 4px 12px rgba(198,40,40,.3)}
.issue .num.mid{background:linear-gradient(135deg,#F2B33D,#C98400)!important;box-shadow:0 4px 12px rgba(201,132,0,.3)}
.legend i{border-radius:4px}
.chk{transition:all .2s}.chk:hover{border-color:var(--vnpt);color:var(--vnpt)}
#tip{background:rgba(15,26,42,.92);backdrop-filter:blur(6px);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.anim-v{transform-box:fill-box;transform-origin:50% 100%;animation:growY .75s cubic-bezier(.2,.8,.2,1) both}
.anim-h{transform-box:fill-box;transform-origin:0 50%;animation:growX .75s cubic-bezier(.2,.8,.2,1) both}
.anim-hn{transform-box:fill-box;transform-origin:100% 50%;animation:growX .75s cubic-bezier(.2,.8,.2,1) both}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade-in{animation:fadeIn 1s ease .3s both}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.pop-c{animation:popc .7s cubic-bezier(.2,.8,.2,1) both}@keyframes popc{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.chart svg rect,.chart svg circle{transition:filter .2s,opacity .2s}
.chart svg rect:hover{filter:brightness(1.08) drop-shadow(0 2px 4px rgba(0,0,0,.18))}
.hm td.c{transition:transform .15s}.hm td.c:hover{outline:2px solid #0057B8;outline-offset:-2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.ring-arc{stroke-dashoffset:var(--off)!important}.draw{stroke-dashoffset:0!important}}
@media (max-width:860px){body.nav-mini .layout{grid-template-columns:1fr}nav.side{flex-direction:row;flex-wrap:wrap}nav.side .nav-toggle,nav.side .nav-foot{display:none}}
@media print{.page-in,.kpi,.card,.issue{animation:none}.anim-v,.anim-h,.anim-hn,.pop,.pop-c,.fade-in{animation:none}.draw{stroke-dashoffset:0;animation:none}.ring-arc{stroke-dashoffset:var(--off);animation:none}}
.kpis.wide{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
</style>
<!-- Cổng điều hành: chỉ người đã đăng nhập tại trang chủ (phiên SSO) mới xem được -->
<style id="vnpt-sso-guard">body{visibility:hidden!important}</style>
<script id="vnpt-sso">
/* ===== VNPT HPG – SSO dùng chung với Cổng điều hành =====
   Chỉ tài khoản trong SSO_USERS được vào bằng phiên của Cổng; các tài khoản khác đăng nhập riêng tại ứng dụng.
   Phiên do Cổng tạo: sessionStorage['vnpt_hpg_sso'] = {v:1,u,role,h,k,iat,last} (không chứa mật khẩu).
   PORTAL_URL: đường dẫn tới trang chính; mặc định Cổng nằm ở thư mục cha. */
window.VNPT_SSO = window.VNPT_SSO || (function(){
  var KEY='vnpt_hpg_sso', IDLE_MIN=30, MAX_HOURS=8;   // phải giống CONFIG của Cổng
  var PORTAL_URL='../index.html';
  var APP_ID='bcs';
  var SSO_USERS={'vnpt.hpg':'06d45f47017a0deb599accdea49f5e56708b5e9809d9f93b47b9bdabefab099a'};   // tài khoản SSO -> SHA-256("tài_khoản:mật_khẩu")
  function has(u){ return Object.prototype.hasOwnProperty.call(SSO_USERS,u); }

'use strict';
/* ===================== TIỆN ÍCH ===================== */
const NF = {};
function nf(d){ return NF[d] || (NF[d] = new Intl.NumberFormat('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d})); }
const ok = v => v !== null && v !== undefined && typeof v === 'number' && isFinite(v);
const fN = (v,d=0) => ok(v) ? nf(d).format(v) : '—';
const fP = (v,d=1) => ok(v) ? nf(d).format(v*100)+'%' : '—';
const fS = (v,d=0) => ok(v) ? (v>0?'+':'')+nf(d).format(v) : '—';
const fPP = (v,d=1) => ok(v) ? (v>0?'+':'')+nf(d).format(v*100)+' đ.%' : '—';
const sdiv = (a,b) => (ok(a)&&ok(b)&&b!==0) ? a/b : null;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = a => a.reduce((s,x)=>s+(ok(x)?x:0),0);
const mean = a => { const b=a.filter(ok); return b.length? sum(b)/b.length : null; };
const median = a => { const b=a.filter(ok).sort((x,y)=>x-y); if(!b.length) return null; const m=b.length>>1; return b.length%2?b[m]:(b[m-1]+b[m])/2; };
const stdev = a => { const b=a.filter(ok); if(b.length<2) return null; const m=mean(b); return Math.sqrt(sum(b.map(x=>(x-m)*(x-m)))/(b.length-1)); };
function pearson(x,y){ const p=x.map((v,i)=>[v,y[i]]).filter(q=>ok(q[0])&&ok(q[1])); if(p.length<3) return null;
  const mx=mean(p.map(q=>q[0])), my=mean(p.map(q=>q[1])); let a=0,b=0,c=0; p.forEach(([u,v])=>{a+=(u-mx)*(v-my);b+=(u-mx)**2;c+=(v-my)**2;}); return (b&&c)? a/Math.sqrt(b*c):null; }
function rankDesc(vals){ // competition ranking (đồng hạng cùng thứ hạng, như hàm RANK của Excel)
  return vals.map(v => ok(v) ? 1 + vals.filter(w => ok(w) && w > v + 1e-12).length : null); }
function h(tag, attrs, html){ const e=document.createElement(tag); if(attrs) for(const k in attrs){ if(k==='class') e.className=attrs[k]; else if(k.startsWith('on')) e[k]=attrs[k]; else e.setAttribute(k,attrs[k]); } if(html!=null) e.innerHTML=html; return e; }

/* ===================== TOOLTIP ===================== */
const TIP = document.getElementById('tip');
function tipShow(ev, html){ TIP.innerHTML = html; TIP.style.display='block'; tipMove(ev); }
function tipMove(ev){ const w=TIP.offsetWidth, hgt=TIP.offsetHeight; let x=ev.clientX+14, y=ev.clientY+14; if(x+w>innerWidth-8) x=ev.clientX-w-14; if(y+hgt>innerHeight-8) y=ev.clientY-hgt-14; TIP.style.left=x+'px'; TIP.style.top=y+'px'; }
function tipHide(){ TIP.style.display='none'; }
function bindTip(node, html){ node.addEventListener('mouseenter',e=>tipShow(e, typeof html==='function'?html():html)); node.addEventListener('mousemove',tipMove); node.addEventListener('mouseleave',tipHide); }

/* ===================== BIỂU ĐỒ SVG (ngoại tuyến, không thư viện) ===================== */
const NS='http://www.w3.org/2000/svg';
function S(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }
function shade(hex, amt){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255; const t=amt>0?255:0, p=Math.abs(amt); r=Math.round(r+(t-r)*p); g=Math.round(g+(t-g)*p); b=Math.round(b+(t-b)*p); return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
let GID=0;
function grad(svg, color, horiz){ if(!color||color[0]!=='#'||color.length!==7) return color; let defs=svg.querySelector('defs'); if(!defs){ defs=S('defs',{}); svg.prepend(defs); }
  const key=(horiz?'h':'v')+color.slice(1); let g=defs.querySelector('[data-k="'+key+'"]');
  if(!g){ const id='gr'+(++GID); g=S('linearGradient',horiz?{id,x1:0,y1:0,x2:1,y2:0,'data-k':key}:{id,x1:0,y1:1,x2:0,y2:0,'data-k':key},defs);
    S('stop',{offset:'0%','stop-color':shade(color,horiz?0.28:-0.08)},g); S('stop',{offset:'100%','stop-color':horiz?color:shade(color,0.30)},g); }
  return 'url(#'+g.getAttribute('id')+')'; }
function areaGrad(svg,color){ let defs=svg.querySelector('defs'); if(!defs){ defs=S('defs',{}); svg.prepend(defs); } const id='ag'+(++GID); const g=S('linearGradient',{id,x1:0,y1:0,x2:0,y2:1},defs); S('stop',{offset:'0%','stop-color':color,'stop-opacity':0.28},g); S('stop',{offset:'100%','stop-color':color,'stop-opacity':0},g); return 'url(#'+id+')'; }
function svgRoot(host, W, H){ host.innerHTML=''; const s=S('svg',{viewBox:`0 0 ${W} ${H}`, role:'img'}); host.appendChild(s); return s; }
function hostW(host){ return Math.max(320, Math.floor(host.clientWidth || host.parentNode.clientWidth || 640)); }
function niceMax(v){ if(!(v>0)) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function legend(host, items){ const d=h('div',{class:'legend'}); items.forEach(it=>{ d.appendChild(h('span',null,`<i style="background:${it.color};${it.dash?'height:2px':''}"></i>${esc(it.name)}`)); }); host.prepend(d); }
function safeChart(host, fn){ try{ fn(); }catch(e){ console.error(e); host.innerHTML = `<div class="err-card">Không vẽ được biểu đồ: ${esc(e.message)}</div>`; } }

  const x0=lw+(minV<0?56:0), x1=W-(o.rightPad||64), X=v=>x0+(x1-x0)*(v-minV)/((maxV-minV)||1);

/* Đường (xếp hạng theo tháng – trục đảo: hạng 1 ở trên) */
function lineChart(host, o){ safeChart(host, ()=>{
  const W=hostW(host), H=o.height||260, pl=40, pr=o.padR||110, pt=12, pb=28; const s=svgRoot(host,W,H);
  const all=o.series.flatMap(se=>se.values).filter(ok); const yMin=o.yMin!=null?o.yMin:Math.min(...all), yMax=o.yMax!=null?o.yMax:Math.max(...all);
  const n=o.xs.length, X=i=>pl+(W-pl-pr)*(n>1?i/(n-1):0.5), Y=v=>{ const t=(v-yMin)/((yMax-yMin)||1); return o.invert? pt+(H-pt-pb)*t : pt+(H-pt-pb)*(1-t); };
  (o.ticks||[yMin,(yMin+yMax)/2,yMax]).forEach(v=>{ S('line',{x1:pl,x2:W-pr,y1:Y(v),y2:Y(v),stroke:'#EDF1F6'},s); const t=S('text',{x:pl-6,y:Y(v)+3,'text-anchor':'end','font-size':10,fill:'#7A8594'},s); t.textContent=(o.fmt||fN)(v); });

  const ends=[];

    S('path',{d,fill:'none',stroke:se.color,'stroke-width':2.4,'stroke-linejoin':'round','stroke-linecap':'round',pathLength:1,class:'draw'},s);
    se.values.forEach((v,i)=>{ if(!ok(v)) return; const c=S('circle',{cx:X(i),cy:Y(v),r:3.5,fill:se.color,stroke:'#fff','stroke-width':1.5},s);
      const hit=S('circle',{cx:X(i),cy:Y(v),r:9,fill:'transparent'},s); bindTip(hit,`<b>${esc(se.name)}</b><br>${esc(o.xs[i])}: ${(o.tipFmt||o.fmt||fN)(v)}`); });

  if(o.series.length>1) legend(host, o.series.map(se=>({name:se.name,color:se.color})));

/* Phân tán */
function scatter(host, o){ safeChart(host, ()=>{
  const W=hostW(host), H=o.height||300, pl=58, pr=70, pt=14, pb=40; const s=svgRoot(host,W,H); const P=o.points.filter(p=>ok(p.x)&&ok(p.y));
  if(!P.length){ host.innerHTML='<div class="muted small">Không đủ dữ liệu hợp lệ để vẽ.</div>'; return; }
  let xmin=Math.min(...P.map(p=>p.x)), xmax=Math.max(...P.map(p=>p.x)), ymin=Math.min(...P.map(p=>p.y), o.refY!=null?o.refY:Infinity), ymax=Math.max(...P.map(p=>p.y), o.refY!=null?o.refY:-Infinity);
  const dx=(xmax-xmin)||1, dy=(ymax-ymin)||0.1; xmin-=dx*0.06; xmax+=dx*0.06; ymin-=dy*0.08; ymax+=dy*0.08;
  const X=v=>pl+(W-pl-pr)*(v-xmin)/(xmax-xmin), Y=v=>pt+(H-pt-pb)*(1-(v-ymin)/(ymax-ymin));
  for(let k=0;k<=4;k++){ const xv=xmin+(xmax-xmin)*k/4, yv=ymin+(ymax-ymin)*k/4;
    S('line',{x1:pl,x2:W-pr,y1:Y(yv),y2:Y(yv),stroke:'#EDF1F6'},s); let t=S('text',{x:pl-6,y:Y(yv)+3,'text-anchor':'end','font-size':10,fill:'#7A8594'},s); t.textContent=(o.yFmt||fN)(yv);
    t=S('text',{x:X(xv),y:H-22,'text-anchor':'middle','font-size':10,fill:'#7A8594'},s); t.textContent=(o.xFmt||fN)(xv); }
  let t=S('text',{x:(pl+W-pr)/2,y:H-5,'text-anchor':'middle','font-size':11,fill:'#4A5565'},s); t.textContent=o.xLabel||'';
  t=S('text',{x:12,y:(pt+H-pb)/2,'text-anchor':'middle','font-size':11,fill:'#4A5565',transform:`rotate(-90 12 ${(pt+H-pb)/2})`},s); t.textContent=o.yLabel||'';
  if(o.refY!=null){ S('line',{x1:pl,x2:W-pr,y1:Y(o.refY),y2:Y(o.refY),stroke:'#C62828','stroke-dasharray':'4 3'},s); t=S('text',{x:W-pr,y:Y(o.refY)-4,'text-anchor':'end','font-size':10,fill:'#C62828'},s); t.textContent=o.refYLabel||''; }

    if(p.label){ const tl=S('text',{x:X(p.x)+8,y:Y(p.y)+4,'font-size':10.5,fill:'#1B2430'},s); tl.textContent=p.label; }

/* Radar */

  const W=Math.min(hostW(host),560), H=Math.min(W,420), cx=W/2, cy=H/2+4, R=Math.min(W,H)/2-62; const s=svgRoot(host,W,H); const n=o.axes.length;
  const pt=(i,r)=>[cx+r*Math.sin(2*Math.PI*i/n), cy-r*Math.cos(2*Math.PI*i/n)];
  [0.25,0.5,0.75,1].forEach(k=>{ S('polygon',{points:o.axes.map((_,i)=>pt(i,R*k).join(',')).join(' '),fill:'none',stroke:'#E2E8F0'},s); });
  o.axes.forEach((a,i)=>{ const [x,y]=pt(i,R); S('line',{x1:cx,y1:cy,x2:x,y2:y,stroke:'#E2E8F0'},s); const [lx,ly]=pt(i,R+14); const t=S('text',{x:lx,y:ly+3,'text-anchor':Math.abs(lx-cx)<8?'middle':lx>cx?'start':'end','font-size':10.5,fill:'#4A5565'},s); t.textContent=a; });
  o.series.forEach(se=>{ const pts=se.values.map((v,i)=>pt(i,R*(ok(v)?Math.max(0,Math.min(1,v)):0))); S('polygon',{points:pts.map(p=>p.join(',')).join(' '),fill:se.color,'fill-opacity':0.16,stroke:se.color,'stroke-width':2.2,'stroke-linejoin':'round',class:'pop-c',style:`transform-origin:${cx}px ${cy}px`},s);
    pts.forEach((p,i)=>{ const c=S('circle',{cx:p[0],cy:p[1],r:3.5,fill:se.color},s); const hit=S('circle',{cx:p[0],cy:p[1],r:9,fill:'transparent'},s); bindTip(hit,`<b>${esc(se.name)}</b><br>${esc(o.axes[i])}: ${ok(se.values[i])?fN(se.values[i]*100,0)+'/100':'không có dữ liệu'}`); }); });

/* ===================== BẢNG: sắp xếp + xuất CSV ===================== */
function table(host, cols, rows, o={}){
  host.innerHTML=''; const tools=h('div',{class:'tbl-tools'}); const cnt=h('span',{class:'cnt'}); tools.appendChild(cnt);
  const btns=h('div'); const bcsv=h('button',{class:'btn'},'⤓ Xuất CSV'); btns.appendChild(bcsv); tools.appendChild(btns); host.appendChild(tools);
  const wrap=h('div',{class:'tbl-wrap'}); if(o.maxH) wrap.style.maxHeight=o.maxH; host.appendChild(wrap);
  let sortK=o.sortKey||null, sortD=o.sortDir||1; let data=rows.slice();
  function val(r,c){ return c.v? c.v(r) : r[c.k]; }
  function draw(){
    if(sortK!=null){ const c=cols.find(c=>c.k===sortK); data.sort((a,b)=>{ const x=val(a,c), y=val(b,c); if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; return (typeof x==='number'&&typeof y==='number'? x-y : String(x).localeCompare(String(y),'vi'))*sortD; }); }
    const t=h('table',{class:'t'}); const thead=h('thead'); const tr=h('tr');
    cols.forEach(c=>{ const th=h('th',{class:c.num?'num':''}, esc(c.t)+(sortK===c.k?(sortD>0?' ▲':' ▼'):'')); if(c.title) th.title=c.title; th.onclick=()=>{ if(sortK===c.k) sortD=-sortD; else { sortK=c.k; sortD=c.num?-1:1; } draw(); }; tr.appendChild(th); });
    thead.appendChild(tr); t.appendChild(thead); const tb=h('tbody');
    data.forEach(r=>{ const tr=h('tr'); cols.forEach(c=>{ const td=h('td',{class:(c.num?'num ':'')+(c.click?'clk':'')}); const v=val(r,c); td.innerHTML = c.f? c.f(r,v) : esc(v==null?'—':v); if(c.click) td.onclick=()=>c.click(r); if(c.cls) td.className+=' '+c.cls(r); tr.appendChild(td); }); tb.appendChild(tr); });
    t.appendChild(tb); wrap.innerHTML=''; wrap.appendChild(t); cnt.textContent=`${data.length} dòng`+(o.note?' · '+o.note:'');
  }
  bcsv.onclick=()=>{ const lines=[cols.map(c=>c.t)]; data.forEach(r=>lines.push(cols.map(c=>{ const v=c.csv? c.csv(r) : val(r,c); return v==null?'':(typeof v==='number'? String(Math.round(v*1e6)/1e6).replace('.',','):String(v)); })));
    const csv='﻿'+lines.map(l=>l.map(x=>{ const s=String(x).replace(/<[^>]+>/g,''); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(';')).join('\r\n');
    const a=h('a',{href:URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),download:(o.file||'bang_du_lieu')+'.csv'}); document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),100); };
  draw(); return {redraw:draw};
}

  const s=svgRoot(host,W,H); const x0=lw, x1=W-(o.rightW||12); let y=8;
  rows.forEach(r=>{ if(r.header){ const t=S('text',{x:4,y:y+14,'font-size':11.5,'font-weight':700,fill:'#003C82'},s); t.textContent=r.header; y+=hh; return; }
    const lb=S('text',{x:lw-8,y:y+rh/2+4,'text-anchor':'end','font-size':11.5,fill:'#1B2430'},s); lb.textContent=r.label;
    const tot=sum(r.parts.map(p=>p.v));
    if(!tot){ const t=S('text',{x:x0+4,y:y+rh/2+4,'font-size':11,fill:'#8A94A3'},s); t.textContent=r.na||'không được giao'; y+=rh; return; }
    let cx=x0; r.parts.forEach(p=>{ if(!p.v) return; const w=(x1-x0)*p.v/tot; const rc=S('rect',{x:cx,y:y+4,width:Math.max(0,w-2),height:rh-8,fill:grad(s,p.color,false),rx:3,class:'anim-h',style:`animation-delay:${Math.round(cx-x0)}ms`},s);
      if(w>34){ const t=S('text',{x:cx+w/2-1,y:y+rh/2+4,'text-anchor':'middle','font-size':10.5,fill:'#fff','font-weight':600},s); t.textContent=fN(p.v/tot*100,0)+'%'; }
      const hit=S('rect',{x:cx,y:y,width:w,height:rh,fill:'transparent'},s); bindTip(hit,`<b>${esc(r.label)}${r.sub?' – '+esc(r.sub):''}</b><br>${esc(p.name)}: ${fN(p.v,o.dec||0)} (${fN(p.v/tot*100,1)}%)<br>Tổng: ${fN(tot,o.dec||0)}`); cx+=w; });
    if(r.right){ const t=S('text',{x:W-4,y:y+rh/2+4,'text-anchor':'end','font-size':11,fill:'#1B2430','font-weight':600},s); t.textContent=r.right; }
    y+=rh; });
  if(o.legend) legend(host, o.legend);
}); }

/* ===================== MÔ HÌNH DỮ LIỆU ===================== */
const LEVELS = {
  C1:{name:'Địa bàn cấp 1', short:'Cấp 1', revKey:'Doanh thu Địa bàn'},
  C2:{name:'Địa bàn cấp 2', short:'ĐB cấp 2', revKey:'Doanh thu Địa bàn'},
  VNPTKV:{name:'VNPT khu vực', short:'VNPT KV', revKey:'Doanh thu Địa bàn'},
  TTVT:{name:'TTVT khu vực', short:'TTVT', revKey:'Doanh thu BRCĐ'},
  TTCSKH:{name:'TTCSKH', short:'TTCSKH', revKey:'Doanh thu di động'},
  TTKDGP:{name:'TTKDGP', short:'TTKDGP', revKey:'Doanh thu Địa bàn'},
  TTHT:{name:'TTHT', short:'TTHT', revKey:'Doanh thu Địa bàn'}
};
const GROUPS = ['Doanh thu','Thuê bao PTM','CSKH & duy trì thuê bao','Thu cước','Kênh bán','Chất lượng mạng lưới'];
const GSHORT = {'Doanh thu':'Doanh thu VTCNTT','Thuê bao PTM':'TB phát triển mới','CSKH & duy trì thuê bao':'Chăm sóc KH','Thu cước':'Thu cước','Kênh bán':'Kênh bán','Chất lượng mạng lưới':'Chất lượng mạng'};
const GL = g => ({'Doanh thu':'Doanh thu VTCNTT','Thuê bao PTM':'Thuê bao phát triển mới','CSKH & duy trì thuê bao':'Chăm sóc khách hàng'})[g] || g;
const TRENDS = [['lowLong','Thấp kéo dài','02 tháng liên tiếp KCN','#C62828'],['down','Xu hướng thấp đi','CN→QT, CN→KCN, QT→KCN','#E07B39'],['improve','Cần cải thiện','02 tháng liên tiếp QT','#D79A00'],['up','Dấu hiệu tốt lên','KCN→QT, KCN→CN, QT→CN','#5BAE6E'],['keep','Duy trì tốt','02 tháng liên tiếp CN','#1E7F3C']];
function trendOf(i){ const a=i.prev, b=i.st; if(!ST[a]||!ST[b]) return null; if(a==='KCN'&&b==='KCN') return 'lowLong'; if(a==='CN'&&b==='CN') return 'keep'; if(a==='QT'&&b==='QT') return 'improve'; return stPoint(b)>stPoint(a)?'up':'down'; }
const SERVICES = ['Tổng hợp địa bàn','Di động','BRCĐ/Fiber','MyTV/Mesh/Camera','CNTT/DVS doanh nghiệp','TSL/Internet trực tiếp','Thu cước','Chất lượng mạng & khách hàng'];
const MONTHS = ['T1','T2','T3','T4','T5','T6','T7','T8','T9'];
const CFG_DEF = { mGreen:0.8, mYellow:0.5,
  w:{'Doanh thu':30,'Thuê bao PTM':20,'CSKH & duy trì thuê bao':20,'Thu cước':10,'Kênh bán':10,'Chất lượng mạng lưới':10},
  aGap:300, aKCN:12, aLowLong:8, aRankDrop:4, aDep:0.5, aKcnShare:0.5,
  fDown:0.03, fUp:0.05, fPlanG:0, fTarget:0.98 };
let CFG = Object.assign({}, CFG_DEF, LS.get('cfg', {})); CFG.w = Object.assign({}, CFG_DEF.w, (LS.get('cfg',{})||{}).w||{});
function saveCfg(){ LS.set('cfg', CFG); }

const U = DATA.units; const BY = {}; U.forEach(u=>BY[u.id]=u);
const byLevel = l => U.filter(u=>u.level===l);
const AREAS = {}; U.forEach(u=>{ if(u.area){ (AREAS[u.area]=AREAS[u.area]||{})[u.level]=u; } });
const shortName = u => u.level==='C1' ? 'VNPT Hải Phòng (cấp 1)' : u.name;

function statusFrom(r, thr){ if(!ok(r)||!thr) return null; if(thr.dir==='higher') return r<thr.kcn-1e-9?'KCN':(r>=thr.cn-1e-9?'CN':'QT'); return r<=thr.cn+1e-9?'CN':(r>thr.kcn+1e-9?'KCN':'QT'); }
function thrLabel(i){ if(!i.thr) return (i.thrText||[]).join(' | '); const t=i.thr; return t.dir==='higher'? `CN ≥ ${fP(t.cn,1)} · KCN < ${fP(t.kcn,1)}` : `CN ≤ ${fP(t.cn,0)} · KCN > ${fP(t.kcn,0)} (càng thấp càng tốt)`; }
function gapToCN(i){ if(!ok(i.ratio)||!i.thr) return null; return i.thr.dir==='higher' ? i.thr.cn - i.ratio : i.ratio - i.thr.cn; } // >0: còn thiếu so với ngưỡng CN
function needToCN(i){ // lượng tuyệt đối cần bổ sung (hoặc cần giảm với chỉ số càng thấp càng tốt) để đạt ngưỡng CN
  if(!i.absOk||!ok(i.plan)||!ok(i.actual)||!i.thr) return null;
  return i.thr.dir==='higher' ? Math.max(0, i.plan*i.thr.cn - i.actual) : Math.max(0, i.actual - i.plan*i.thr.cn); }
const hasFlag = i => i.flags && i.flags.length>0;
function flagText(i){ const m=[]; if(i.flags.includes('ratio_mismatch')) m.push(`Tỷ lệ nguồn (${fP(i.ratio,2)}) không khớp TH/Giao (${ok(i.rr)?fP(i.rr,2):'không tính được'})`); if(i.flags.includes('status_mismatch')) m.push(`Trạng thái nguồn "${i.st}" khác trạng thái tính lại theo ngưỡng "${i.stCalc}"`); if(i.flags.includes('no_status')) m.push('Thiếu trạng thái'); if(!i.absOk && !i.flags.includes('ratio_mismatch')) m.push('Giá trị tuyệt đối không nhất quán'); return m.join('; '); }
function flagMark(i){ return hasFlag(i)||!i.absOk ? ` <span class="flag" title="${esc(flagText(i)||'Giá trị tuyệt đối không nhất quán')}">⚑</span>` : ''; }

/* ----- tính toán dẫn xuất cho mỗi đơn vị ----- */
function compute(){
  U.forEach(u=>{
    const L=LEVELS[u.level]; u.rev = u.inds.find(i=>i.name===L.revKey) || null;
    u.revRatio = u.rev? u.rev.ratio : null; u.revSt = u.rev? u.rev.st : null;
    u.revPlan = u.rev && u.rev.absOk ? u.rev.plan : null; u.revAct = u.rev && u.rev.absOk ? u.rev.actual : null;
    u.revGap = ok(u.revPlan)&&ok(u.revAct) ? u.revAct - u.revPlan : null;
    u.g = {}; GROUPS.forEach(g=>{ const xs=u.inds.filter(i=>i.group===g); if(!xs.length) return; const pts=xs.map(i=>stPoint(i.st)).filter(ok);
      u.g[g]={n:xs.length, score: pts.length? mean(pts):null, cn:xs.filter(i=>i.st==='CN').length, qt:xs.filter(i=>i.st==='QT').length, kcn:xs.filter(i=>i.st==='KCN').length, inds:xs}; });
    u.sv = {}; SERVICES.forEach(g=>{ const xs=u.inds.filter(i=>i.service===g); if(!xs.length) return; const pts=xs.map(i=>stPoint(i.st)).filter(ok);
      u.sv[g]={n:xs.length, score: pts.length? mean(pts):null, cn:xs.filter(i=>i.st==='CN').length, qt:xs.filter(i=>i.st==='QT').length, kcn:xs.filter(i=>i.st==='KCN').length, inds:xs}; });
    // điểm phân tích đề xuất (0–100)
    let ws=0, acc=0; GROUPS.forEach(g=>{ if(u.g[g] && ok(u.g[g].score)){ const w=+CFG.w[g]||0; ws+=w; acc+=w*u.g[g].score; } });
    u.ana = ws? acc/ws*100 : null;
    // BCS hiệu chỉnh tham khảo (chỉ với đơn vị có trọng số + BCS chính thức)
    u.adj = null; u.adjItems=[];
    if(ok(u.bcs)){ let delta=0; u.inds.forEach(i=>{ if(!ok(i.weight)) return;
        let r=null; if(i.flags.includes('status_mismatch')) r=i.ratio; else if(i.flags.includes('ratio_mismatch') && i.kind!=='revenue' && ok(i.rr)) r=i.rr;
        if(r==null) return; const q = i.thr&&i.thr.dir==='lower' ? i.weight*Math.min(1/r,1.3) : i.weight*Math.min(r,1.3);
        const d = q-(ok(i.qd)?i.qd:0); delta+=d; u.adjItems.push({name:i.name, r, st:statusFrom(r,i.thr), d}); });
      u.adj = u.bcs + delta; }
    // lịch sử xếp hạng
    if(u.hist){ const prev=u.hist.slice(0,8).filter(ok); u.rankAvgPrev = mean(prev); u.rankT8=u.hist[7]; u.rankT9=u.hist[8];
      u.rankDelta = ok(u.rankAvgPrev)&&ok(u.rankT9) ? u.rankT9 - u.rankAvgPrev : null; // >0: T9 kém hơn bình quân trước
      u.rankBest=Math.min(...u.hist.filter(ok)); u.rankWorst=Math.max(...u.hist.filter(ok)); u.rankSd=stdev(u.hist);
      u.rankQ3=mean(u.hist.slice(6,9)); u.rankH1=mean(u.hist.slice(0,6)); }
    u.nInd=u.inds.length; u.kcnShare = sdiv(u.cnt.KCN, u.nInd);
    u.nFlags = u.inds.filter(i=>hasFlag(i)).length;
  });
  // điểm phân tích: xếp hạng trong cấp
  Object.keys(LEVELS).forEach(l=>{ const us=byLevel(l); const r=rankDesc(us.map(u=>u.ana)); us.forEach((u,k)=>u.anaRank=r[k]); const ra=rankDesc(us.map(u=>u.adj)); us.forEach((u,k)=>u.adjRank=ra[k]); const rr=rankDesc(us.map(u=>u.revRatio)); us.forEach((u,k)=>u.revRank=rr[k]); });
  // rủi ro
  U.forEach(u=>{ const pts=[]; const peers=byLevel(u.level), n=peers.length;
    if(u.revSt==='KCN') pts.push(['Doanh thu chính dưới ngưỡng KCN',1]);
    if(n>4 && ok(u.revRatio)){ const q=peers.map(p=>p.revRatio).filter(ok).sort((a,b)=>a-b); if(u.revRatio<=q[Math.floor((q.length-1)*0.25)]) pts.push(['Tỷ lệ doanh thu thuộc 25% thấp nhất cùng cấp',1]); }
    if(ok(u.rank)&&n>4&&u.rank>n*0.75) pts.push(['Hạng BCS T09 thuộc 25% thấp nhất',1]);
    if(ok(u.kcnShare)&&u.kcnShare>=CFG.aKcnShare) pts.push([`≥${fP(CFG.aKcnShare,0)} chỉ số ở mức KCN`,1]);
    if(u.trend.lowLong>=CFG.aLowLong) pts.push([`≥${CFG.aLowLong} chỉ số KCN 2 tháng liên tiếp`,1]);
    if(ok(u.rankDelta)&&u.rankDelta>=CFG.aRankDrop) pts.push([`Hạng T09 kém hơn bình quân T1–T8 ≥${CFG.aRankDrop} bậc`,1]);
    u.riskPts=pts; u.risk=sum(pts.map(p=>p[1])); u.riskSingle = n<=4; u.riskLv = u.riskSingle ? (u.risk>=2?'Cao':u.risk>=1?'Trung bình':'Thấp') : (u.risk>=4?'Cao':u.risk>=2?'Trung bình':'Thấp'); if(u.riskSingle) pts.push(['(Đơn vị không có nhóm cùng cấp để so sánh – chỉ xét yếu tố tuyệt đối: Cao ≥ 2, TB = 1)',0]); });
}
const riskBadge = u => `<span class="badge ${u.riskLv==='Cao'?'b-KCN':u.riskLv==='Trung bình'?'b-QT':'b-CN'}" title="${esc(u.riskPts.map(p=>p[0]+' (+'+p[1]+')').join('\n')||'Không có yếu tố rủi ro')}">${u.riskLv} (${u.risk})</span>`;
function cellClass(score){ if(!ok(score)) return 'NA'; return score>=CFG.mGreen-1e-9?'CN':score>=CFG.mYellow-1e-9?'QT':'KCN'; }

/* ----- liên kết cùng tên địa bàn (không khẳng định quan hệ cha–con) ----- */
function linked(u, indName){ if(!u.area) return []; const a=AREAS[u.area]; return Object.values(a).filter(x=>x.id!==u.id).map(x=>({u:x, i:x.inds.find(i=>i.name===indName)})).filter(o=>o.i); }

/* ----- thư viện hành động đề xuất (cần đơn vị chủ trì xác nhận) ----- */
function actionFor(i){
  const n=i.name, s=i.service;
  if(i.group==='Doanh thu'){
    if(s==='Tổng hợp địa bàn') return 'Phân rã thiếu hụt theo các chỉ số doanh thu thành phần (di động, BRCĐ, MyTV/Mesh/Cam, CNTT, TSL); giao mục tiêu bù đắp theo tuần cho từng dịch vụ và theo dõi tại giao ban.';
    if(s==='CNTT/DVS doanh nghiệp') return 'Rà soát danh mục hợp đồng/dự án DVS DN chưa nghiệm thu, chưa xuất hóa đơn; đẩy nhanh ký kết các cơ hội đang chào giá; kiểm tra việc ghi nhận doanh thu đúng địa bàn.';
    if(s==='BRCĐ/Fiber') return 'Tập trung giữ thuê bao Fiber (gia hạn trả trước, chăm sóc thuê bao có nguy cơ rời mạng), nâng gói tốc độ cao; rà soát thuê bao tạm ngưng/nợ cước.';
    if(s==='Di động') return 'Đẩy bán gói data/bundle cho tập thuê bao chưa gói và thuê bao đến hạn gia hạn; tăng tỷ trọng PTM có gói giá trị cao.';
    if(s==='MyTV/Mesh/Camera') return 'Bán kèm MyTV/Mesh/Camera vào tập khách hàng Fiber hiện hữu theo chiến dịch combo; giao chỉ tiêu cho kênh KTĐB khi lắp đặt/xử lý sự cố.';
    if(s==='TSL/Internet trực tiếp') return 'Rà soát khách hàng kênh truyền/Internet trực tiếp sắp hết hợp đồng, nguy cơ chuyển mạng; chủ động gia hạn và nâng cấp băng thông.';
  }
  if(i.group==='Thuê bao PTM') return 'Giao chỉ tiêu PTM theo tuần cho từng kênh (NVKD, ĐUQ, KTĐB, AM); theo dõi tỷ lệ chuyển đổi đơn hàng và xử lý ngay điểm nghẽn lắp đặt/nghiệm thu.';
  if(/rời mạng/i.test(n)) return 'Lập danh sách thuê bao có dấu hiệu rời mạng (nợ cước, báo hỏng nhiều lần, hết khuyến mại) để chăm sóc chủ động; phân tích lý do rời mạng tháng 9 theo nguồn.';
  if(i.group==='CSKH & duy trì thuê bao') return 'Tổ chức nhắc gia hạn sớm (trước hạn ≥15 ngày) qua đa kênh, ưu đãi gia hạn chu kỳ dài; đối soát danh sách cần gia hạn với kết quả thực hiện hằng tuần.';
  if(i.group==='Thu cước') return 'Đôn đốc thu nợ theo tuổi nợ và danh sách khách hàng lớn; phối hợp kênh thu để gạch nợ đúng hạn.';
  if(i.group==='Kênh bán') return 'Rà soát nhân viên/điểm bán không phát sinh sản lượng; kèm cặp, giao sản phẩm trọng tâm, tái cấu trúc kênh kém hiệu quả.';
  if(i.group==='Chất lượng mạng lưới') return 'Rà soát phiếu lắp đặt/báo hỏng quá hạn và khảo sát không hài lòng; khắc phục theo nhóm nguyên nhân chính.';
  return 'Rà soát nguyên nhân và lập kế hoạch khắc phục cụ thể.';
}
function recsFor(u){
  const out=[]; const nW = u.inds.filter(i=>ok(i.weight)).length;
  u.inds.forEach(i=>{ if(i.st!=='KCN' && i.st!=='QT') return;
    const pr = i.st==='KCN' && i.prev==='KCN' ? 'Khẩn cấp' : i.st==='KCN' ? 'Cao' : 'Trung bình';
    const prn = pr==='Khẩn cấp'?0:pr==='Cao'?1:2; const g=gapToCN(i); const w=ok(i.weight)?i.weight:(1/Math.max(1,u.inds.length));
    const impact = w*Math.max(0, ok(g)?g:0)*(i.group==='Doanh thu'?1.5:1);
    const need=needToCN(i);
    const lk=linked(u,i.name); const coop = lk.length ? lk.map(o=>`${o.u.name} (${o.i.st||'—'})`).join(', ') : 'Cấp có thẩm quyền xác nhận';
    out.push({u, i, pr, prn, impact,
      issue: `${i.name}: ${ST[i.st]}${i.prev?` (T08: ${ST[i.prev]||i.prev})`:''}`,
      gap: `${fP(i.ratio)} so với ngưỡng CN ${i.thr?fP(i.thr.cn,1):'—'}`+(ok(need)?` · cần ${i.thr.dir==='higher'?'bổ sung':'giảm'} ${fN(need, i.kind==='rate'?2:0)} ${esc(i.unit)}`:''),
      target: i.thr? (i.thr.dir==='higher'?`Tỷ lệ ≥ ${fP(i.thr.cn,1)} KH tháng`:`Tỷ lệ ≤ ${fP(i.thr.cn,0)} KH tháng`) : 'Đạt ngưỡng CN',
      action: actionFor(i), owner: u.name, coop,
      deadline: pr==='Khẩn cấp'?'7 ngày':pr==='Cao'?'30 ngày':'Đến 31/12/2026',
      kpi: `Tỷ lệ TH/KH "${i.name}" hằng tuần; trạng thái T10 đạt ${i.thr&&i.thr.dir==='lower'?'≤':'≥'} ngưỡng CN` });
  });
  out.sort((a,b)=>a.prn-b.prn || b.impact-a.impact);
  return out;
}

/* ----- cảnh báo tự động ----- */
function alerts(){
  const A=[]; const add=(u,ind,val,thr,sev,rec,type)=>A.push({u,ind,val,thr,sev,rec,type});
  U.forEach(u=>{
    if(u.rev && u.revSt==='KCN') add(u, u.rev.name, fP(u.revRatio), u.rev.thr?`< ${fP(u.rev.thr.kcn,0)} KH`:'', 'Cao','Phân rã thiếu hụt theo dịch vụ, giao mục tiêu bù đắp theo tuần','Hoàn thành thấp');
    else if(u.rev && u.revSt==='QT') add(u, u.rev.name, fP(u.revRatio), u.rev.thr?`${fP(u.rev.thr.kcn,0)}–${fP(u.rev.thr.cn,0)} KH`:'', 'Trung bình','Theo dõi tuần, chống trượt xuống KCN','Hoàn thành thấp');
    if(ok(u.revGap) && -u.revGap>=CFG.aGap) add(u, u.rev.name, fN(u.revGap,1)+' Tr.đ', `thiếu ≥ ${fN(CFG.aGap)} Tr.đ`, -u.revGap>=CFG.aGap*3?'Cao':'Trung bình','Ưu tiên nguồn lực vào dịch vụ có thiếu hụt tuyệt đối lớn','Thiếu hụt lớn');
    if(u.cnt.KCN>=CFG.aKCN) add(u,'Số chỉ số KCN', `${u.cnt.KCN}/${u.nInd}`, `≥ ${CFG.aKCN}`, u.cnt.KCN>=CFG.aKCN+4?'Cao':'Trung bình','Lập kế hoạch khắc phục theo nhóm chỉ tiêu, ưu tiên chỉ số có trọng số lớn','Nhiều chỉ tiêu yếu');
    if(u.trend.lowLong>=CFG.aLowLong) add(u,'Chỉ số KCN 2 tháng liên tiếp', String(u.trend.lowLong), `≥ ${CFG.aLowLong}`, 'Cao','Kiểm điểm nguyên nhân, giao giải pháp có thời hạn 7 ngày','Yếu kéo dài');
    if(ok(u.rankDelta)&&u.rankDelta>=CFG.aRankDrop) add(u,'Xếp hạng BCS T09', `Hạng ${u.rankT9} (BQ T1–T8: ${fN(u.rankAvgPrev,1)})`, `kém hơn ≥ ${CFG.aRankDrop} bậc`, 'Trung bình','Rà soát chỉ số chuyển trạng thái xấu đi trong T09','T09 suy giảm');

    if(ok(u.rank) && u.rank<=5){ const cnBy={}; u.inds.filter(i=>i.st==='CN').forEach(i=>cnBy[i.group]=(cnBy[i.group]||0)+1); const tot=u.cnt.CN; const top=Object.entries(cnBy).sort((a,b)=>b[1]-a[1])[0];

  });

}

/* ----- chỉ báo nhịp Q4 dựa trên T09 (proxy – không phải dự báo KH năm) ----- */
function proxyQ4(u){
  if(!u.rev || !ok(u.revRatio)) return null; const r=u.revRatio;
  const rDown=Math.max(0, r-CFG.fDown), rUp=r+CFG.fUp; const plan=u.revPlan; const pm = ok(plan)? plan*(1+CFG.fPlanG) : null;
  const q = rr => ok(pm)? 3*pm*rr : null;
  const cls = !u.rev.absOk && !ok(r) ? 'Chưa đủ dữ liệu' : r>=CFG.fTarget-1e-9 ? 'Khả năng cao' : rUp>=CFG.fTarget-1e-9 ? 'Cần nỗ lực' : 'Rủi ro cao';
  return {r, rDown, rUp, pm, q4Plan: ok(pm)?3*pm:null, qDown:q(rDown), qBase:q(r), qUp:q(rUp), gapBase: ok(pm)? 3*pm*(r-1):null, cls, absOk:u.rev.absOk};
}

  if(churn) out.push({sev:'Cao', t:`Thuê bao rời mạng Fiber ${fP(churn.ratio,0)} kế hoạch – KCN 2 tháng liên tiếp`,

  const bot=[...c2].sort((a,b)=>b.rank-a.rank).slice(0,3);
  out.push({sev:'Cao', t:`Nhóm địa bàn cuối bảng: ${bot.map(u=>u.area).join(', ')}`,
    ev: bot.map(u=>`${u.area}: BCS ${fN(u.bcs*100,1)}, hạng ${u.rank} (BQ T1–T8 ${fN(u.rankAvgPrev,1)}), ${u.cnt.KCN} KCN, DT ${fP(u.revRatio)}`).join('; '),
    imp:'Kéo giảm kết quả chung của địa bàn.', act:'Giao kế hoạch khắc phục riêng (xem Tra cứu đơn vị), theo dõi tuần; ưu tiên chỉ số KCN có trọng số lớn.'});
  const cntt=c1.inds.find(i=>i.name==='Doanh thu CNTT');
  if(cntt) out.push({sev:'Trung bình', t:`Doanh thu CNTT chỉ đạt ${fP(cntt.ratio)} kế hoạch – khoảng cách lớn nhất trong các dịch vụ`,
    ev:`TH ${fN(cntt.actual)}/${fN(cntt.plan)} Tr.đ, thiếu ${fN(cntt.plan-cntt.actual)} Tr.đ (${fP((cntt.plan-cntt.actual)/(r.plan-r.actual))} thiếu hụt doanh thu tổng). ${c2.filter(u=>{const i=u.inds.find(x=>x.name==='Doanh thu CNTT');return i&&i.st==='KCN';}).length}/${c2.length} ĐB cấp 2 KCN chỉ số này.`,
    imp:'Dịch vụ số doanh nghiệp là động lực tăng trưởng; chậm ghi nhận làm hụt doanh thu tổng.', act:'Rà soát hợp đồng/dự án DVS DN chưa nghiệm thu, chưa xuất hóa đơn; TTKDGP phối hợp địa bàn đẩy nhanh ký kết các cơ hội đang chào giá.'});
  return out.slice(0,5);
}

function rankHistory(us, l){
  const n=us.length;
  const box=card('Lịch sử xếp hạng BCS T1–T9','Xanh = nhóm 1/3 đầu, vàng = giữa, đỏ = 1/3 cuối; σ = độ dao động thứ hạng');
  const cls=r=>!ok(r)?'NA':r<=Math.ceil(n/3)?'CN':r<=Math.ceil(2*n/3)?'QT':'KCN';
  let html='<div class="tbl-wrap"><table class="t hm"><thead><tr><th>Đơn vị</th>'+MONTHS.map(m=>`<th class="num">${m}</th>`).join('')+'<th class="num">BQ</th><th class="num">σ</th></tr></thead><tbody>';
  [...us].sort((a,b)=>a.rank-b.rank).forEach(u=>{ html+=`<tr><td>${unitLink(u)}</td>`+(u.hist||[]).map(r=>`<td class="c ${cls(r)}">${r??'—'}</td>`).join('')+`<td class="num">${fN(mean(u.hist),1)}</td><td class="num">${fN(u.rankSd,1)}</td></tr>`; });
  box.innerHTML=html+'</tbody></table></div>';
  const lb=card('Diễn biến thứ hạng – đơn vị chọn','Mặc định: 3 đơn vị đầu và 3 đơn vị cuối bảng T09 (hạng 1 ở trên); chọn tối đa 6 đơn vị');
  const sel=new Set([...us].sort((a,b)=>a.rank-b.rank).filter((u,k)=>k<3||k>=n-3).map(u=>u.id));
  const pills=h('div',{class:'pill-row'}); const ch=h('div',{class:'chart'});
  const draw=()=>{ const ss=us.filter(u=>sel.has(u.id)).slice(0,6); lineChart(ch,{xs:MONTHS, series:ss.map((u,k)=>({name:u.area,color:CAT[k%6],values:u.hist})), invert:true, yMin:1, yMax:n, ticks:[1,Math.round(n/2),n], fmt:v=>fN(v), tipFmt:v=>'Hạng '+v}); };
  us.forEach(u=>{ const lab=h('label',{class:'chk'}); const cb=h('input',{type:'checkbox'}); cb.checked=sel.has(u.id); cb.onchange=()=>{ if(cb.checked){ if(sel.size>=6){cb.checked=false;return;} sel.add(u.id);} else sel.delete(u.id); draw(); }; lab.appendChild(cb); lab.appendChild(document.createTextNode(u.area)); pills.appendChild(lab); });
  lb.appendChild(ch); lb.appendChild(pills); draw();

function unitBody(u, full){
  const peers=byLevel(u.level), n=peers.length;
  kpis([
    {l:'BCS', v:ok(u.bcs)?fN(u.bcs*100,2):'—', s:ok(u.rank)?`Hạng ${u.rank}/${n} · BQ cấp: ${fN(mean(peers.map(p=>p.bcs))*100,2)}`:'Không xếp hạng BCS', c:ok(u.bcs)?'':'na'},
    {l:u.rev?u.rev.name+' – tỷ lệ':'Doanh thu', v:fP(u.revRatio,2), s:u.rev? stBadge(u.revSt)+(n>1?` hạng tỷ lệ ${u.revRank}/${n}`:''):'—', c:(u.revSt||'na').toLowerCase()},
    {l:'Thực hiện / Kế hoạch (Tr.đ)', v:ok(u.revAct)?fN(u.revAct,1):'—', s:ok(u.revPlan)?`KH: ${fN(u.revPlan,1)} · chênh ${fS(u.revGap,1)}`:''},

function diagnose(u){

  if(u.rev) D.push(['fact',`${esc(u.rev.name)} đạt ${fP(u.revRatio,2)} KH T09 (${ST[u.revSt]})${ok(u.revPlan)?`; TH ${fN(u.revAct,1)} / KH ${fN(u.revPlan,1)} ${esc(u.rev.unit)}`:''}.`]);
  D.push(['fact',`${u.cnt.KCN}/${u.nInd} chỉ số KCN, trong đó ${k2.length} chỉ số KCN 2 tháng liên tiếp${k2.length?': '+k2.map(i=>esc(i.name)).join(', '):''}.`]);
  const byG=GROUPS.filter(g=>u.g[g]).map(g=>[g,u.g[g]]).sort((a,b)=>a[1].score-b[1].score);
  if(byG.length) D.push(['ana',`Nhóm yếu nhất: <b>${esc(GL(byG[0][0]))}</b> (điểm ${fN(byG[0][1].score*100,0)}); nhóm tốt nhất: <b>${esc(GL(byG[byG.length-1][0]))}</b> (điểm ${fN(byG[byG.length-1][1].score*100,0)}).`]);
  const wi=u.inds.filter(i=>ok(i.weight)&&i.st!=='CN').map(i=>({i,loss:i.weight*Math.max(0,gapToCN(i)||0)})).sort((a,b)=>b.loss-a.loss).slice(0,3);
  if(wi.length) D.push(['ana',`Chỉ số ảnh hưởng lớn nhất tới kết quả chưa đạt (trọng số × khoảng cách tới ngưỡng CN): ${wi.map(x=>`${esc(x.i.name)} (TS ${fP(x.i.weight,0)}, thiếu ${fPP(gapToCN(x.i))})`).join('; ')}.`]);
  const ptm=u.inds.filter(i=>i.group==='Thuê bao PTM'&&i.st==='KCN'), svRev=u.inds.filter(i=>i.group==='Doanh thu'&&i.st!=='CN'&&i.name!==LEVELS[u.level].revKey);
  if(ptm.length && svRev.length) D.push(['hyp',`PTM yếu (${ptm.map(i=>esc(i.name)).join(', ')}) có thể đang góp phần vào doanh thu dịch vụ chưa đạt (${svRev.map(i=>esc(i.name)).join(', ')}).`]);
  const ch=u.inds.find(i=>/rời mạng Fiber/.test(i.name)); if(ch&&ch.st==='KCN') D.push(['hyp',`Rời mạng Fiber ${fP(ch.ratio)} KH có thể làm giảm doanh thu BRCĐ các tháng tới – cần làm rõ nguyên nhân rời mạng (giá, chất lượng, đối thủ).`]);
  if(u.hist && ok(u.rankDelta)) D.push(['ana',`Thứ hạng T09 (${u.rankT9}) ${u.rankDelta>0?'kém hơn':'tốt hơn'} bình quân T1–T8 (${fN(u.rankAvgPrev,1)}) ${fN(Math.abs(u.rankDelta),1)} bậc; độ dao động σ = ${fN(u.rankSd,1)} → kết quả ${u.rankSd>4?'kém bền vững':'tương đối ổn định'}.`]);
  return D;
}

    const us=BL.map(l=>AREAS[BK.area][l]);
    box.appendChild(h('div',{class:'small',style:'margin:8px 0'}, us.map((u,k)=>u?`<span class="dot" style="background:${BLC[BL[k]]}"></span> ${unitLink(u)}: điểm thực hiện <b>${fN(u.bcs*100,1)}</b> (hạng ${u.rank}/17), ${u.cnt.CN} CN · ${u.cnt.QT} QT · ${u.cnt.KCN} KCN`:'').join('<br>')));
    const gg=h('div',{class:'two'}); box.appendChild(gg); const c1=h('div',{class:'chart'}), c2=h('div',{class:'chart'}); gg.appendChild(c1); gg.appendChild(c2);
    const gp=BL.map((l,k)=>GROUPS.map(gr=>unitGroupPt(us[k],gr)));
    barGroup(c1,{cats:GROUPS.map(x=>GSHORT[x]), series:BL.map((l,k)=>({name:BLN[l],color:BLC[l],values:gp[k].map(x=>x?x.pt:null)})), allLabels:true, max:Math.ceil(Math.max(...gp.flat().filter(Boolean).map(x=>x.pt))/20)*20, lblFmt:(v,i,j)=>`${fN(v,1)}/${fN(gp[j][i].max,0)}`, fmt:v=>fN(v,1), naText:'không giao', height:290, rotate:true, padB:70, axisFmt:v=>fN(v,0),
      tipExtra:i=>'<br>'+BL.map((l,k)=>{ const x=us[k]&&us[k].g[GROUPS[i]]; return `${BLN[l]}: `+(x? `điểm TH ${fN(gp[k][i].pt,2)}/${fN(gp[k][i].max,0)} – `+x.inds.map(ii=>`${esc(ii.name)} ${fP(ii.ratio)} (${ii.st})`).join('; ') : 'không giao'); }).join('<br>')});
    barGroup(c2,{cats:TRENDS.map(t=>t[1]), series:BL.map((l,k)=>({name:BLN[l],color:BLC[l],values:TRENDS.map(t=>us[k]?us[k].trend[t[0]]:null)})), allLabels:true, lblFmt:v=>fN(v,0), fmt:v=>fN(v,0)+' chỉ số', axisFmt:v=>fN(v), intAxis:true, height:290, rotate:true, padB:70,
      tipExtra:i=>'<br>'+BL.map((l,k)=>{ const t=TRENDS[i][0]; const xs=us[k]?us[k].inds.filter(ii=>trendOf(ii)===t):[]; return `${BLN[l]}: ${xs.length} chỉ số, điểm TH ${fN(us[k]?trendPt(us[k],t):null,1)} – ${xs.map(ii=>esc(ii.name)).join(', ')||'—'}`; }).join('<br>')});
  }
  drawF();
}

(function init(){
  if(LS.get('navMini',false)) document.body.classList.add('nav-mini');
  try{ compute(); }catch(e){ console.error(e); V.innerHTML=`<div class="err-card"><b>Lỗi tính toán:</b> ${esc(e.message)}</div>`; return; }
  document.getElementById('footer').innerHTML='VNPT Hải Phòng · Dashboard điều hành SXKD · Tháng 09/2026 · Tài liệu nội bộ';
  window.addEventListener('hashchange', route);
  let rt; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>render(true),250); });
  route();
})();

</script>
